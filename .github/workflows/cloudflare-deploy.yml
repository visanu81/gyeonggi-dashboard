name: Deploy to Cloudflare Workers

# GitHub Actions 무료시간(월 2000분) 절약 — 적응형 배포.
# 서버(update_data.py의 maybe_deploy)가 상황을 보고 필요할 때만 'deploy-trigger' 브랜치에
# push해서 배포를 띄운다: 이슈(특보/예비특보/하천위험 변화) 즉시 · 특보 발효중 20분 · 평소 40분.
# 매 push마다 배포하던 옛 방식(≈288회/일) 대비 대폭 절감. 긴급 알림은 서버의 1분 텔레그램(별개).
# schedule은 서버 트리거가 죽어도 최소 갱신을 보장하는 안전망(3시간).

# ⚠ 2026-08-28부터 통합 배포(deploy-ggweather.yml)가 세 사이트를 모두 올린다.
# 이 워크플로를 자동으로 돌리면 '지역 전용판'이 전체판을 덮어써서 되돌아가므로
# 트리거를 껐다. 비상시 수동 실행만 가능(그 경우에도 통합 배포를 다시 돌려 복구할 것).
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy 2>&1
