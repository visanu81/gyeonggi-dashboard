name: Deploy to Cloudflare Workers (테스트 2)

# staging 브랜치에 push하면 테스트 버전(gyeonggi-dashboard-2)으로 배포.
# 운영(gyeonggi-dashboard, main 브랜치)과 완전히 분리 — 운영에 영향 없음.
# 여기서 확인하고 괜찮으면 staging → main 으로 합쳐 운영에 반영.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to gyeonggi-dashboard-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to gyeonggi-dashboard-2 (테스트 버전)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
        # --name 으로 운영과 다른 Worker 이름 지정 → 별도 주소(gyeonggi-dashboard-2...)
        run: wrangler deploy --name gyeonggi-dashboard-2 2>&1
