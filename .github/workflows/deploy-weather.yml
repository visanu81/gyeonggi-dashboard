name: Deploy 경기남부 (weather.visanu81.workers.dev)

# 같은 저장소를 '경기남부 버전'으로 바꿔서 별도 Worker(weather)에 올린다.
# 운영(gyeonggi-dashboard, 경기북부)은 전혀 건드리지 않는다 — Worker 이름이 다르면
# 완전히 별개의 사이트다.
#
# 어떻게 남부가 되나 (아래 '남부 버전으로 교체' 단계):
#   data-south.js   → data.js        (남부 21개 시군 데이터)
#   map-geo-south.js→ map-geo.js     (남부 지도 경계)
#   region-south.js → region.js      (시군 목록·배치·중점 관서·라벨)
#   risk-zones-south.js → risk-zones.js (남부 위험구역 시트 — 지금은 비어 있음)
#   HTML 안의 운영 주소·'경기북부' 글자 → 남부 것으로 치환
# 저장소 원본은 그대로 두고 배포용 사본만 바꾸므로 북부에 영향이 없다.

# 배포 시점은 운영(cloudflare-deploy.yml)과 똑같이 맞춘다.
# main에 붙이면 서버가 5분마다 데이터를 푸시할 때마다 배포가 돌아 Actions 무료시간이
# 순식간에 바닥난다. 그래서 서버가 '지금 올릴 만하다'고 판단할 때만 밀어 넣는
# deploy-trigger 브랜치와, 그게 죽었을 때를 위한 3시간 안전망만 본다.
# ⚠ 2026-08-28부터 통합 배포(deploy-ggweather.yml)가 세 사이트를 모두 올린다.
# 이 워크플로를 자동으로 돌리면 '지역 전용판'이 전체판을 덮어써서 되돌아가므로
# 트리거를 껐다. 비상시 수동 실행만 가능(그 경우에도 통합 배포를 다시 돌려 복구할 것).
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-weather
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to weather (경기남부)
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 남부 데이터가 있는지 확인
        run: |
          for f in data-south.js map-geo-south.js region-south.js risk-zones-south.js; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 가 없거나 비어 있습니다. 남부 사이트를 올릴 수 없습니다."
              exit 1
            fi
          done
          echo "남부 파일 4종 확인 완료"

      - name: 남부 버전으로 교체
        run: |
          set -e
          mv data-south.js     data.js
          mv map-geo-south.js  map-geo.js
          mv region-south.js   region.js
          mv risk-zones-south.js risk-zones.js
          # 화면들이 운영(북부) 주소로 data.js를 직접 부르는 곳이 있다 → 남부 주소로
          # 바꾸지 않으면 남부 사이트가 북부 데이터를 그린다.
          grep -rl 'gyeonggi-dashboard\.visanu81\.workers\.dev' --include='*.html' --include='*.js' . \
            | xargs -r sed -i 's|gyeonggi-dashboard\.visanu81\.workers\.dev|weather.visanu81.workers.dev|g'
          # 화면에 박힌 지역 이름
          grep -rl '경기북부' --include='*.html' . \
            | xargs -r sed -i 's|경기북부|경기남부|g'
          # 머리말 문구 — 관서 수가 지역마다 달라 글자를 바꿔야 한다.
          # (화면이 그려진 뒤 자바스크립트로 고치는 방식은 dc-runtime이 다시 그리며
          #  되돌려 놓아서 안 통한다. 그래서 파일 자체를 바꾼다.)
          # 값의 출처: region-south.js 의 office / countText
          grep -rl '동두천소방서 · 11개 소방관서' --include='*.html' . \
            | xargs -r sed -i 's|동두천소방서 · 11개 소방관서|경기남부 · 21개 시군|g'
          grep -rl '11개 소방관서' --include='*.html' . \
            | xargs -r sed -i 's|11개 소방관서|21개 시군|g; s|10개 시군|21개 시군|g'
          echo "--- 남은 북부 흔적(있으면 확인 필요) ---"
          grep -rn 'gyeonggi-dashboard\.visanu81\|경기북부\|11개 소방관서' \
            --include='*.html' --include='*.js' . | head -20 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to weather
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --name 으로 운영과 다른 Worker 이름 지정 → weather.visanu81.workers.dev
        run: wrangler deploy --name weather 2>&1
