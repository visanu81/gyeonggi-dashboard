/* ── 화면 ── 색은 지도.html 과 같은 토큰 */
:root{
  --bg:#eef1f7; --bg2:#e6ebf4; --surface:#fff; --surface2:#f3f7fc; --border:#e4e9f2; --border2:#d3dbe9;
  --ink:#0f1b2d; --ink2:#4b5a74; --ink3:#71809a; --brand:#2563eb; --brandSoft:#e9f0ff;
  --safe:#0ea371; --safeSoft:#e5f7f0; --caution:#e0930a; --cautionSoft:#fdf2df; --warn:#ef6c1a; --warnSoft:#ffece0;
  --severe:#d42a2f; --severeSoft:#fbe3e3; --hexEmpty:#dde5f1; --sh:0 1px 2px rgba(16,27,45,.06),0 6px 18px -10px rgba(16,27,45,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#080d18; --bg2:#0b1222; --surface:#111a2c; --surface2:#18233b; --border:#26314c; --border2:#354364;
  --ink:#e9eef9; --ink2:#9fb0cf; --ink3:#8090ad; --brand:#4b8bf5; --brandSoft:rgba(75,139,245,.15);
  --safe:#34d399; --safeSoft:rgba(52,211,153,.13); --caution:#fbbf24; --cautionSoft:rgba(251,191,36,.13); --warn:#fb923c; --warnSoft:rgba(251,146,60,.14);
  --severe:#ef4444; --severeSoft:rgba(239,68,68,.16); --hexEmpty:#1e2a45; --sh:0 1px 2px rgba(0,0,0,.5),0 8px 22px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#080d18; --bg2:#0b1222; --surface:#111a2c; --surface2:#18233b; --border:#26314c; --border2:#354364;
  --ink:#e9eef9; --ink2:#9fb0cf; --ink3:#8090ad; --brand:#4b8bf5; --brandSoft:rgba(75,139,245,.15);
  --safe:#34d399; --safeSoft:rgba(52,211,153,.13); --caution:#fbbf24; --cautionSoft:rgba(251,191,36,.13); --warn:#fb923c; --warnSoft:rgba(251,146,60,.14);
  --severe:#ef4444; --severeSoft:rgba(239,68,68,.16); --hexEmpty:#1e2a45; --sh:0 1px 2px rgba(0,0,0,.5),0 8px 22px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-feature-settings:'tnum';-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2) 70%)}
button,select{font-family:inherit;font-size:13px;color:var(--ink)}
.top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top h1{font-size:17px;margin:0 6px 0 0;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.top .sp{flex:1}
.top select,.btn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-weight:700}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.upd{font-size:12px;color:var(--ink3);white-space:nowrap}.upd.old{color:var(--warn);font-weight:700}
.editbar{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:var(--brandSoft);border-bottom:1px solid var(--border);font-size:13px}
body.editing .editbar{display:flex}
.editbar b{margin-right:4px}
.chip{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-weight:700;font-size:12.5px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
#grid{margin:6px 10px 40px}
.grid-stack-item-content{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden!important}
body.editing .grid-stack-item-content{outline:2px dashed color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:-2px}
.wh{display:flex;align-items:center;gap:6px;padding:9px 12px 6px;font-size:13px;font-weight:800;color:var(--ink2);flex:none}
body.editing .wh{cursor:move}
.wh .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .x{display:none;border:0;background:var(--severeSoft);color:var(--severe);width:24px;height:24px;border-radius:7px;cursor:pointer;font-weight:900}
body.editing .wh .x{display:block}
.wb{flex:1;min-height:0;overflow:auto;padding:0 12px 10px;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{height:24px;padding:0 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink2)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{color:var(--ink3);font-size:12.5px;padding:10px 0}
.muted{color:var(--ink3)}
.lv-safe{color:var(--safe)}.lv-warn{color:var(--warn)}.lv-severe{color:var(--severe)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:800}
.b-safe{background:var(--safeSoft);color:var(--safe)}.b-warn{background:var(--warnSoft);color:var(--warn)}.b-severe{background:var(--severeSoft);color:var(--severe)}.b-caution{background:var(--cautionSoft);color:var(--caution)}
/* 상태 */
.status{display:flex;align-items:center;gap:12px;height:100%;padding:4px 2px;border-radius:12px}
.status .dot{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px}
.status.safe .dot{background:var(--safeSoft)}.status.warn .dot{background:var(--warnSoft)}.status.severe .dot{background:var(--severeSoft)}
.status .big{font-size:22px;font-weight:900;letter-spacing:-.4px}
.status .why{font-size:12.5px;color:var(--ink2);margin-top:2px}
/* 수치 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:10px;padding:8px 10px}
.kpi .k{font-size:11.5px;color:var(--ink3);font-weight:700}
.kpi .v{font-size:21px;font-weight:900;letter-spacing:-.4px;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 목록·막대 */
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:64px 1fr 58px;align-items:center;gap:8px;font-size:12.5px}
.row .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:800}
.row.me .n{color:var(--brand)}
.bar{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.item{padding:7px 9px;border-radius:9px;background:var(--surface2);margin-bottom:5px;font-size:12.5px;line-height:1.45}
.item .h{display:flex;gap:6px;align-items:center;font-weight:800;margin-bottom:1px}
.item .h .tm{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11.5px}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{position:sticky;top:0;background:var(--surface);text-align:right;color:var(--ink3);font-size:11.5px;font-weight:700;padding:4px 4px;border-bottom:1px solid var(--border)}
.tb td{padding:4px;text-align:right;border-bottom:1px solid var(--border)}
.tb th:first-child,.tb td:first-child{text-align:left;font-weight:700}
.tb tr.me td{background:var(--brandSoft)}
.img{width:100%;height:calc(100% - 32px);object-fit:contain;border-radius:8px;background:var(--surface2)}
svg text{font-family:inherit}
.fc{display:flex;align-items:flex-end;gap:6px;height:calc(100% - 4px);min-height:90px}
.fc .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;gap:3px}
.fc .c .col{width:70%;max-width:34px;background:var(--brand);border-radius:5px 5px 2px 2px;min-height:2px}
.fc .c .mm{font-weight:800}
.add-note{font-size:12px;color:var(--ink3);margin-left:auto}
@media (max-width:760px){ .top{padding:8px 10px}.top h1{font-size:15px;width:100%}.hide-m{display:none!important}#grid{margin:6px 6px 30px}
  /* 휴대폰: 격자 대신 PC 배치 순서(위→아래, 왼→오)대로 한 줄 쌓기. 목록형은 내용만큼, 그림형은 고정 높이 */
  #grid.grid-stack{display:flex!important;flex-direction:column;gap:8px;height:auto!important}
  #grid>.grid-stack-item{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;min-height:0!important}
  #grid>.grid-stack-item>.grid-stack-item-content{position:relative!important;inset:auto!important;left:0!important;right:0!important;top:0!important;bottom:0!important}
  #grid>.grid-stack-item .wb{max-height:62vh}
  #grid>.grid-stack-item[data-t="map"] .wb{height:400px;max-height:none}
  #grid>.grid-stack-item[data-t="image"] .wb{height:420px;max-height:none}
  #grid>.grid-stack-item[data-t="riverTrend"] .wb{height:270px}
  #grid>.grid-stack-item[data-t="fcst"] .wb{height:190px}
  #grid>.grid-stack-item>.ui-resizable-handle{display:none!important}
}
</style>
</head>
<body>
<div class="top">
  <h1 id="ttl">위젯 상황판</h1>
  <select id="selSido" style="display:none" title="시도"></select>
  <select id="selStation" title="내 관서"></select>
  <span class="upd" id="upd">—</span>
  <span class="sp"></span>
  <select id="selPreset" class="hide-m" title="기본 배치 불러오기">
    <option value="">기본 배치 ▾</option>
    <option value="normal">평상시</option>
    <option value="rain">호우 대응</option>
    <option value="river">하천 감시</option>
    <option value="all">전부 보기</option>
  </select>
  <button class="btn hide-m" id="btnEdit" title="위젯 옮기기·크기·추가·삭제">✎ 꾸미기</button>
  <button class="btn ghost" id="btnTheme" title="라이트/다크">◐</button>
  <a class="btn ghost" href="지도.html" style="display:inline-flex;align-items:center;text-decoration:none" title="기존 지도 화면">지도 화면</a>
</div>
<div class="editbar">
  <b>＋ 위젯 추가</b><span id="addList"></span>
  <span class="add-note">제목 줄을 끌어 옮기고, 모서리를 당겨 크기 조절 · 배치는 이 브라우저에 저장됩니다</span>
  <button class="chip" id="btnReset">↺ 처음 배치로</button>
</div>
<div class="grid-stack" id="grid"></div>

<script>
(function(){
  'use strict';
  var RC = window.REGION_CONF || {};
  var ALIAS = RC.alias || {}, ORDER = RC.order || [], SCOPES = RC.scopes || null, SIDOS = RC.sidoList || [];
  var IMGH='';    /* 기상 영상 주소 앞부분 — 빌드가 운영 주소로 바꿔 끼운다 */
  var $ = function(id){ return document.getElementById(id); };
  var storeGet = function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  var storeSet = function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var num = function(v,d){ return (v==null||v===''||isNaN(+v)) ? '—' : (+v).toFixed(d==null?0:d); };
  var LAYOUT_KEY = 'ggDash.v1.' + (RC.key || 'x');
  var memStation = null;
  function D(){ return window.DASHBOARD_DATA || {}; }

  /* ── 테마 (다른 화면과 같은 저장값) ── */
  function applyTheme(){ var t=storeGet('ggTheme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();
  $('btnTheme').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    storeSet('ggTheme', cur==='dark'?'light':'dark'); applyTheme(); renderAll();
  };

  /* ── 관서 ── */
  function stationNow(){
    var v = memStation || storeGet('ggMyStation');
    if(v && ORDER.indexOf(v)>=0) return v;
    if(RC.home && ORDER.indexOf(RC.home)>=0) return RC.home;
    return ORDER[0] || '';
  }
  function sigunOf(st){ return ALIAS[st] || st; }
  function regOf(st){ var n=sigunOf(st); return (D().regions||[]).filter(function(r){ return r.name===n; })[0] || null; }
  function setStation(st){ memStation=st; storeSet('ggMyStation', st); $('selStation').value=st; renderAll(); }
  function fillSelects(){
    var s=$('selStation'), cur=stationNow(); s.innerHTML='';
    ORDER.forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent='📍 '+n; if(n===cur) o.selected=true; s.appendChild(o); });
    s.onchange=function(){ setStation(s.value); };
    if(SIDOS.length){ var sd=$('selSido'); sd.style.display=''; sd.innerHTML='';
      SIDOS.forEach(function(x){ var o=document.createElement('option'); o.value=x.base; o.textContent=x.label; if(x.label===RC.sidoCurrent) o.selected=true; sd.appendChild(o); });
      sd.onchange=function(){ storeSet('ggSido', sd.value); location.href = sd.value + '대시보드.html'; };
    }
    $('ttl').textContent = (RC.label || '') + ' 위젯 상황판';
    document.title = (RC.label || '') + ' 위젯 상황판';
  }

  /* ── 판정 (쉬운.html 과 같은 규칙) ── */
  var WIDE = (RC.warnOrder||[])[0] || RC.label || '';
  var SEA = /(앞바다|먼바다|전해상|해상|연안바다|평수구역)/;
  function canon(n){
    n=String(n||'').trim(); if(!n) return null;
    if(n===RC.label || n==='수도권') return WIDE;
    if((RC.wideNames||[]).indexOf(n)>=0) return WIDE;
    if(ORDER.indexOf(n)>=0) return n;
    n=n.replace(/(동북부|서북부|동남부|서남부|남부|북부|동부|서부|중부|내륙|산지|해안)/g,'');
    n=n.replace(/(특별자치시|특별자치도|특별시|광역시|자치시|자치도)/g,'');
    if(ORDER.indexOf(n)>=0) return n;
    return n.replace(/(시|군|구|도)$/,'').trim()||null;
  }
  function areaHits(area, name){
    var me=canon(sigunOf(name));
    return String(area||'').split(/[,·\/()]/).some(function(p){
      p=p.trim(); if(!p || SEA.test(p)) return false; if(p.indexOf('전역')>=0) return true;
      if(SCOPES && SCOPES[p]) return SCOPES[p].some(function(n){ return n===name || sigunOf(n)===sigunOf(name); });
      var c=canon(p); return c===WIDE || c===me;
    });
  }
  function isBo(w){ return w.level==='severe' || String(w.type||'').indexOf('경보')>=0; }

  }};
  W.messages = { title:'재난문자', icon:'📨', w:4, h:4, render:function(el){
    var ms=D().messages||[]; if(!ms.length){ el.innerHTML='<div class="empty">받은 재난문자 없음</div>'; return; }
    el.innerHTML=ms.slice(0,20).map(function(m){ return '<div class="item"><div class="h">'+esc(m.region||m.sender||'')+'<span class="tm">'+esc(m.time||'')+'</span></div>'+esc(m.text||'')+'</div>'; }).join('');
  }};
  W.fire = { title:'산불 위험', icon:'🔥', w:4, h:3, render:function(el){
    var f=D().fire||[]; if(!f.length){ el.innerHTML='<div class="empty">자료 없음</div>'; return; }
    var c=function(l){ return l>=4?'severe':l>=3?'warn':l>=2?'caution':'safe'; };
    el.innerHTML='<div class="rows">'+f.map(function(x){ return '<div class="row" style="grid-template-columns:1fr auto"><span class="n">'+esc(x.region)+'</span><span class="badge b-'+c(+x.level)+'">'+esc(x.levelText||x.level)+'</span></div>'; }).join('')+'</div>';
  }};

  /* 위젯 안의 탭 버튼 — data-o(옵션 이름)·data-v(값)를 이 위젯 설정에 저장하고 다시 그린다 */
  function tabs(el, inst){
    el.querySelectorAll('.tabs button[data-o]').forEach(function(b){ b.onclick=function(){
      inst.opt=inst.opt||{}; var v=b.getAttribute('data-v'); inst.opt[b.getAttribute('data-o')] = (v==='1'?true:v==='0'?false:v);
      save(); W[inst.type].render(el, inst);
    }; });
  }

  /* ── 기본 배치 ── x,y,w,h 는 12칸 격자 기준 */
  var PRESETS = {
    normal: [['status',0,0,4,2],['kpi',4,0,8,2],['map',0,2,4,7],['warnings',4,2,4,4],['fcst',8,2,4,3],['image',8,5,4,5,{k:'radar'}],['rain',4,6,4,4],['rivers',0,9,4,5],['weather',4,10,4,5],['messages',8,10,4,4]],
    rain:   [['status',0,0,4,2],['kpi',4,0,8,2],['map',0,2,4,7,{m:'r1'}],['image',4,2,4,6,{k:'radar'}],['image',8,2,4,6,{k:'qpf'}],['rain',0,9,4,5],['fcst',4,8,4,3],['warnings',8,8,4,5],['rivers',4,11,4,5]],
    river:  [['status',0,0,4,2],['kpi',4,0,8,2],['rivers',0,2,4,7],['riverTrend',4,2,4,4],['riverTrend',8,2,4,4],['map',4,6,4,7,{m:'day'}],['rain',8,6,4,5,{by:'day'}],['warnings',0,9,4,4]],
    all:    null
  };
  function presetList(name){
    if(name==='all'){ var out=[], x=0, y=0; Object.keys(W).forEach(function(t){ var w=W[t]; if(x+w.w>12){ x=0; y+=6; } out.push([t,x,y,w.w,w.h]); x+=w.w; }); return out; }
    return PRESETS[name] || PRESETS.normal;
  }
  var uidN=0; function uid(){ return 'w'+Date.now().toString(36)+(uidN++); }
  function fromPreset(name){ return presetList(name).map(function(p){ return {id:uid(), type:p[0], x:p[1], y:p[2], w:p[3], h:p[4], opt:p[5]?JSON.parse(JSON.stringify(p[5])):{}}; }); }

  /* ── 격자 ── */
  var grid = GridStack.init({ column:12, cellHeight:62, margin:6, float:false, staticGrid:true, animate:true,
    draggable:{handle:'.wh'} }, '#grid');   /* 휴대폰은 격자 대신 CSS 로 한 줄 쌓기(아래 order) */
  var isMobile = function(){ return window.matchMedia('(max-width:760px)').matches; };
  function reorder(){ (grid.engine.nodes||[]).forEach(function(n){ if(n.el) n.el.style.order = (n.y||0)*100 + (n.x||0); }); }
  var INST = {};   /* id → {id,type,opt} */
  function addInst(it){
    var def=W[it.type]; if(!def) return;
    var inst={id:it.id||uid(), type:it.type, opt:it.opt||{}}; INST[inst.id]=inst;
    var el=document.createElement('div'); el.className='grid-stack-item';
    ['x','y','w','h'].forEach(function(k){ if(it[k]!=null) el.setAttribute('gs-'+k, it[k]); });
    if(it.x==null) el.setAttribute('gs-auto-position','true');
    el.setAttribute('gs-id', inst.id); el.setAttribute('gs-min-w', 2); el.setAttribute('gs-min-h', 2); el.setAttribute('data-t', inst.type);
    el.innerHTML='<div class="grid-stack-item-content"><div class="wh"><span>'+def.icon+'</span><span class="t">'+esc(def.title)+'</span><button class="x" title="빼기">×</button></div><div class="wb"></div></div>';
    $('grid').appendChild(el); grid.makeWidget(el);
    el.querySelector('.x').onclick=function(){ grid.removeWidget(el); delete INST[inst.id]; save(); };
    renderOne(inst);
  }
  function renderOne(inst){
    var el=document.querySelector('.grid-stack-item[gs-id="'+inst.id+'"] .wb'); if(!el) return;
    try{ W[inst.type].render(el, inst); }catch(e){ el.innerHTML='<div class="empty">표시 오류: '+esc(e.message)+'</div>'; if(window.console) console.error(e); }
  }
  function renderAll(){ Object.keys(INST).forEach(function(k){ renderOne(INST[k]); }); updStamp(); }
  function save(){
    reorder();
    if(loading) return;
    var out=grid.save(false).map(function(n){ var i=INST[n.id]; return i?{id:n.id,type:i.type,x:n.x,y:n.y,w:n.w,h:n.h,opt:i.opt}:null; }).filter(Boolean);
    storeSet(LAYOUT_KEY, JSON.stringify(out));
  }
  var loading=false;
  function load(list){
    loading=true;
    grid.removeAll(true);
    /* removeAll 이 DOM 을 다 못 지우는 경우가 있어(정적 격자 상태) 남은 카드를 직접 치운다 */
    Array.prototype.slice.call(document.querySelectorAll('#grid > .grid-stack-item')).forEach(function(e){ e.remove(); });
    Object.keys(INST).forEach(function(k){ delete INST[k]; });
    list.forEach(addInst); loading=false; save();
  }
  grid.on('change', save);
  grid.on('removed', save);

  var saved=null; try{ saved=JSON.parse(storeGet(LAYOUT_KEY)||'null'); }catch(e){}
  load(Array.isArray(saved) && saved.length ? saved : fromPreset('normal'));

  /* ── 꾸미기 ── */
  function setEditing(on){ document.body.classList.toggle('editing', on); grid.setStatic(!on); $('btnEdit').classList.toggle('on', on); $('btnEdit').textContent = on?'✓ 완료':'✎ 꾸미기'; }
  $('btnEdit').onclick=function(){ if(isMobile()) return; setEditing(!document.body.classList.contains('editing')); };
  $('addList').innerHTML = Object.keys(W).map(function(t){ return '<button class="chip" data-t="'+t+'">'+W[t].icon+' '+esc(W[t].title)+'</button>'; }).join(' ');
  $('addList').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ var t=b.getAttribute('data-t'); addInst({type:t, w:W[t].w, h:W[t].h}); save();
    var last=document.querySelector('.grid-stack-item[gs-id]:last-child'); if(last && last.scrollIntoView) last.scrollIntoView({behavior:'smooth', block:'center'}); }; });
  $('btnReset').onclick=function(){ if(confirm('처음 배치(평상시)로 되돌릴까요? 지금 꾸민 배치는 사라집니다.')) load(fromPreset('normal')); };
  $('selPreset').onchange=function(){ var v=this.value, nm=this.options[this.selectedIndex].text; this.value=''; if(!v) return;
    if(confirm('기본 배치 "'+nm+'"를 불러올까요? 지금 꾸민 배치는 사라집니다.')) load(fromPreset(v)); };

  /* ── 갱신 ── 60초마다 새 데이터 */
  function updStamp(){
    var u=D().updated||'', el=$('upd'); if(!u){ el.textContent='자료 없음'; return; }
    var t=new Date(u.replace(' ','T')+'+09:00'), m=Math.round((Date.now()-t.getTime())/60000);
    el.textContent='갱신 '+u.slice(5,16)+(isNaN(m)?'':' ('+(m<1?'방금':m+'분 전')+')'); el.classList.toggle('old', m>40);
  }
  function poll(){
    try{
      fetch('data.js?_t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(t){
        if(!t) return; var i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0||j<0) return;
        try{ window.DASHBOARD_DATA = JSON.parse(t.slice(i,j+1)); renderAll(); }catch(e){}
      }).catch(function(){});
    }catch(e){}
  }
  fillSelects(); renderAll();
  setInterval(poll, 60000); setInterval(updStamp, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
  window.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz=setTimeout(renderAll, 200); });
  try{ if(RC.sidoList && RC.sidoCurrent){ var me=RC.sidoList.filter(function(x){ return x.label===RC.sidoCurrent; })[0]; if(me) storeSet('ggSido', me.base); } }catch(e){}
  window.DASHW = { W:W, grid:grid, INST:INST, render:renderAll, load:load, preset:fromPreset };   /* 점검용 */
})();
</script>
</body>
</html>
