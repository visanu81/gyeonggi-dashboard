  function dspSubmit(inst){
    var d = dspDraft(inst.id), st = stationNow();
    if(d.busy) return;
    var place = dspTrim(d.place).slice(0, 40), memo = dspTrim(d.memo).slice(0, 60), typ = d.type;
    if(!typ || (!place && !memo)){ dspSay(d, inst, '종류를 고르고 장소나 메모를 적어 주세요', true); return; }
    d.busy = true; dspSay(d, inst, '', false);
    var el0 = dspBody(inst), b0 = el0 && el0.querySelector('.dsp-add'); if(b0) b0.disabled = true;
    DSPX.send('/api/note', {station:st, sigun:sigunOf(st), type:typ, place:place, memo:memo, wx:DSPX.wx(st)}, function(ok, j, code){
      d.busy = false;
      var el = dspBody(inst);
      if(ok && j && j.ok){
        d.type = ''; d.place = ''; d.memo = '';
        dspSay(d, inst, '기록했습니다', false);
        SIT.notes = SIT.notes || []; SIT.notesFail = false;
        SIT.notes.unshift({id:j.id, ts:Date.now(), station:st, sigun:sigunOf(st), type:typ, place:place, memo:memo});   /* 새로 받아 오기 전에도 바로 보이게 */
        SIT.notesAt = 0; SIT.loadNotes(true);
        if(el) dspDraw(el, inst);
        renderAll();
      } else if(dspKeyBad(ok, j, code)){ dspKeyLost(d, inst); }
      else {
        dspSay(d, inst, (ok && j && j.why) ? j.why : '연결하지 못했습니다', true);
        var b = el && el.querySelector('.dsp-add'); if(b) b.disabled = false;
      }
    });
  }
  function dspDelete(inst, n){
    var d = dspDraft(inst.id);
    if(!confirm('이 메모를 지울까요?')) return;
    DSPX.send('/api/del', {id:n.id}, function(ok, j, code){
      if(ok && j && j.ok){
        SIT.notes = (SIT.notes || []).filter(function(x){ return String(x.id) !== String(n.id); });
        SIT.notesAt = 0; SIT.loadNotes(true);
        var el = dspBody(inst); if(el) dspDraw(el, inst);
        renderAll();
      } else if(dspKeyBad(ok, j, code)){ dspKeyLost(d, inst); }
      else dspSay(d, inst, (ok && j && j.why) ? j.why : '연결하지 못했습니다', true);
    });
  }
  function dspDraw(el, inst){
    var d = dspDraft(inst.id), key = storeGet('ggDspKey'), st = stationNow(), h;
    if(SIT.sim){ el.innerHTML = '<div class="calm">모의 훈련 중에는 출동 메모를 쓰지 않습니다</div>'; return; }
    var msgOn = d.msg && d.ms === (key ? 'k' : 'n');
    var msgH = '<div class="dsp-msg' + (msgOn && d.err ? ' err' : '') + '">' + (msgOn ? esc(d.msg) : '') + '</div>';
    if(!key){
      var s = DSPX.stat, lab = (s && s.locked === false) ? '열쇠 정하기' : '열쇠 넣기';
      el.innerHTML = '<div class="calm">출동 메모가 아직 연결되지 않았습니다</div>'+
        '<div class="dsp-sub m">관서에서 함께 쓰는 열쇠(암호)를 한 번 정하면 이 화면과 쉬운 화면에서 같이 씁니다</div>'+
        '<button type="button" class="btn dsp-key">' + lab + '</button>' + msgH;
      el.querySelector('.dsp-key').onclick = function(){ d.msg = ''; DSPX.setup(); };
      /* 열쇠가 정해져 있는지 모르면 한 번 물어본다 — 답이 오면 이 줄만 다시 그린다(입력칸이 없는 상태라 안전) */
      if(!DSPX.fresh()) DSPX.status(function(){ var b = dspBody(inst); if(b && !SIT.sim && !storeGet('ggDspKey')) dspDraw(b, inst); });
      return;
    }
    h = '<div class="dsp-types">' + DSP_TYPES.map(function(t){
      return '<button type="button" class="dsp-t' + (d.type === t ? ' on' : '') + '" data-t="' + esc(t) + '" aria-pressed="' + (d.type === t ? 'true' : 'false') + '">' + esc(t) + '</button>';
    }).join('') + '</div>'+
      '<div class="dsp-f">'+
      '<input class="dsp-in dsp-place" type="text" maxlength="40" placeholder="장소 (예: 상패동 사거리)" aria-label="장소" autocomplete="off" value="' + esc(d.place) + '">'+
      '<input class="dsp-in dsp-memo" type="text" maxlength="60" placeholder="한 줄 메모" aria-label="한 줄 메모" autocomplete="off" value="' + esc(d.memo) + '">'+
      '<div class="dsp-row"><span class="dsp-sub">이름·연락처·동호수는 적지 않습니다</span><button type="button" class="btn dsp-add"' + (d.busy ? ' disabled' : '') + '>기록</button></div>'+
      msgH + '</div>';
    var notes = (SIT.notes || []).filter(function(n){ return n && n.station === st; }).sort(function(a, b){ return (+b.ts || 0) - (+a.ts || 0); });
    if(SIT.notesFail){
      h += '<div class="dsp-h">' + esc(st) + ' · 최근 7일</div><div class="dsp-fail"><span>열쇠가 맞지 않습니다</span><button type="button" class="btn dsp-rekey">열쇠 넣기</button></div>';
    } else {
      h += '<div class="dsp-h">' + esc(st) + ' · 최근 7일' + (SIT.notes ? ' ' + notes.length + '건' : '') + '</div>';
      notes.slice(0, 8).forEach(function(n, i){
        var tx = [n.place, n.memo].filter(Boolean).join(' · ');
        h += '<div class="dsp-r"><div class="dsp-b"><div class="dsp-l1"><span class="dsp-tm">' + fMDHM(+n.ts) + '</span><span class="dsp-ty">' + esc(n.type) + '</span></div>'+
          (tx ? '<div class="dsp-tx">' + esc(tx) + '</div>' : '') + '</div>'+
          '<button type="button" class="tlx dsp-del" data-i="' + i + '" aria-label="메모 지우기" title="메모 지우기">' + ic('x') + '</button></div>';
      });
    }
    el.innerHTML = h;
    var q = function(sl){ return el.querySelector(sl); };
    var quiet = function(){ var m = q('.dsp-msg'); if(d.msg){ d.msg = ''; if(m){ m.textContent = ''; m.className = 'dsp-msg'; } } };
    var tb = el.querySelectorAll('.dsp-t');
    Array.prototype.forEach.call(tb, function(b){ b.onclick = function(){
      d.type = (d.type === b.getAttribute('data-t')) ? '' : b.getAttribute('data-t');
      Array.prototype.forEach.call(tb, function(o){ var on = o.getAttribute('data-t') === d.type; o.className = 'dsp-t' + (on ? ' on' : ''); o.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      quiet();
    }; });
    var enter = function(ev){ if(ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229){ ev.preventDefault(); dspSubmit(inst); } };
    var ip = q('.dsp-place'), im = q('.dsp-memo');
    ip.oninput = function(){ d.place = ip.value; quiet(); };
    im.oninput = function(){ d.memo = im.value; quiet(); };
    ip.onkeydown = enter; im.onkeydown = enter;
    q('.dsp-add').onclick = function(){ dspSubmit(inst); };
    var rk = q('.dsp-rekey'); if(rk) rk.onclick = function(){ DSPX.setup(); };
    Array.prototype.forEach.call(el.querySelectorAll('.dsp-del'), function(b){ b.onclick = function(){
      var n = notes[+b.getAttribute('data-i')]; if(n) dspDelete(inst, n);
    }; });
  }
  W.dispatch = { title:'출동 메모', w:3, h:7, icon:'siren', render:function(el, inst, force){
    /* 글자 입력칸에 초점이 있으면(한글 입력 중일 수 있다) 자동 새로 그리기는 건너뛴다. 쓰던 글·고른 종류는 위젯마다 따로 기억해 둔다 */
    var ae = document.activeElement;
    if(!force && ae && ae.tagName === 'INPUT' && el.contains(ae)) return;
    dspDraw(el, inst);
  }};

  /* 위젯 안의 구간 버튼 — data-o(옵션 이름)·data-v(값)를 이 위젯 설정에 저장하고 다시 그린다 */
  function tabs(el, inst){
    el.querySelectorAll('.seg button[data-o]').forEach(function(b){ b.onclick=function(){
      inst.opt=inst.opt||{}; var v=b.getAttribute('data-v'); inst.opt[b.getAttribute('data-o')] = (v==='1'?true:v==='0'?false:v);
      save(); W[inst.type].render(el, inst);
    }; });
  }

  /* ── 기본 배치 ── 12칸 격자, 한 칸 높이 64. 가운데 큰 지도를 중심으로 양옆에 목록 */
  var PRESETS = {
    incident:[['status',0,0,3,3],['kpi',3,0,9,3],['timeline',0,3,4,10],['map',4,3,5,10,{m:'r1'}],['report',9,3,3,10],
             ['check',0,13,4,7],['rivers',4,13,5,7],['todo',9,13,3,7],['dispatch',0,20,4,6]],
    normal: [['status',0,0,3,3],['kpi',3,0,9,3],
             ['warnings',0,3,3,3],['rain',0,6,3,4],['fire',0,10,3,3],['map',3,3,6,10],['image',9,3,3,6,{k:'radar'}],['fcst',9,9,3,4],
             ['rivers',0,13,6,8],['weather',6,13,3,8],['messages',9,13,3,8]],
    rain:   [['status',0,0,3,3],['kpi',3,0,9,3],
             ['image',0,3,3,6,{k:'radar'}],['rain',0,9,3,6],['map',3,3,6,12,{m:'r1'}],['image',9,3,3,6,{k:'qpf'}],['fcst',9,9,3,6],
             ['warnings',0,15,4,5],['rivers',4,15,8,5]],
    river:  [['status',0,0,3,3],['kpi',3,0,9,3],
             ['rivers',0,3,6,10],['map',6,3,6,10,{m:'day'}],
             ['riverTrend',0,13,4,5],['riverTrend',4,13,4,5],['rain',8,13,4,5,{by:'day'}]],
    all:    null
  };
  function presetList(name){
    if(name==='all'){ var out=[], x=0, y=0, rowH=0; Object.keys(W).forEach(function(t){ var w=W[t]; if(x+w.w>12){ x=0; y+=rowH; rowH=0; } out.push([t,x,y,w.w,w.h]); x+=w.w; rowH=Math.max(rowH,w.h); }); return out; }
    return PRESETS[name] || PRESETS.normal;
  }
  var uidN=0; function uid(){ return 'w'+Date.now().toString(36)+(uidN++); }
  function fromPreset(name){ return presetList(name).map(function(p){ return {id:uid(), type:p[0], x:p[1], y:p[2], w:p[3], h:p[4], opt:p[5]?JSON.parse(JSON.stringify(p[5])):{}}; }); }

  /* ── 격자 ── */
  var grid = GridStack.init({ column:12, cellHeight:64, margin:8, float:false, staticGrid:true, animate:true,
    draggable:{handle:'.wh'} }, '#grid');   /* 휴대폰은 격자 대신 CSS 로 한 줄 쌓기(아래 order) */
  var isMobile = function(){ return window.matchMedia('(max-width:760px)').matches; };
  function reorder(){ (grid.engine.nodes||[]).forEach(function(n){ if(n.el) n.el.style.order = (n.y||0)*100 + (n.x||0); }); }
  var INST = {};   /* id → {id,type,opt} */
  function addInst(it){
    var def=W[it.type]; if(!def) return;
    var inst={id:it.id||uid(), type:it.type, opt:it.opt||{}}; INST[inst.id]=inst;
    var el=document.createElement('div'); el.className='grid-stack-item';
    ['x','y','w','h'].forEach(function(k){ if(it[k]!=null) el.setAttribute('gs-'+k, it[k]); });
    if(it.x==null) el.setAttribute('gs-auto-position','true');
    el.setAttribute('gs-id', inst.id); el.setAttribute('gs-min-w', 2); el.setAttribute('gs-min-h', 2); el.setAttribute('data-t', inst.type);
    el.innerHTML='<div class="grid-stack-item-content"><div class="wh">'+ic(def.icon || inst.type)+'<span class="t">'+esc(def.title)+'</span><span class="meta"></span><button class="x" aria-label="'+esc(def.title)+' 빼기" title="빼기">'+ic('x')+'</button></div><div class="wb"></div></div>';
    $('grid').appendChild(el); grid.makeWidget(el);
    el.querySelector('.x').onclick=function(){ grid.removeWidget(el); delete INST[inst.id]; save(); };
    renderOne(inst);
  }
  function renderOne(inst){
    var el=document.querySelector('.grid-stack-item[gs-id="'+inst.id+'"] .wb'); if(!el) return;
    try{ W[inst.type].render(el, inst); }catch(e){ el.innerHTML='<div class="calm">표시하지 못함 · '+esc(e.message)+'</div>'; if(window.console) console.error(e); }
  }
  /* 사람이 만지고 있는 위젯은 자동으로 다시 그리지 않는다 — 하천 추이의 고르기 칸이 열려 있을 때, 상황보고에서 글을 드래그해 고른 때 */
  function busyWidget(inst){
    var el=document.querySelector('.grid-stack-item[gs-id="'+inst.id+'"] .wb'); if(!el) return false;
    try{
      var ae=document.activeElement;
      if(inst.type==='riverTrend' && ae && ae.tagName==='SELECT' && el.contains(ae)) return true;
      if(inst.type==='report'){
        var sel=window.getSelection ? window.getSelection() : null;
        if(sel && !sel.isCollapsed && sel.rangeCount && el.contains(sel.getRangeAt(0).commonAncestorContainer)) return true;
      }
    }catch(e){}
    return false;
  }
  function renderAll(){ try{ SIT.renderBar(); }catch(e){ if(window.console) console.error(e); } Object.keys(INST).forEach(function(k){ if(!busyWidget(INST[k])) renderOne(INST[k]); }); updStamp(); }
  var loading=false;
  function save(){
    reorder();
    if(loading) return;
    var out=grid.save(false).map(function(n){ var i=INST[n.id]; return i?{id:n.id,type:i.type,x:n.x,y:n.y,w:n.w,h:n.h,opt:i.opt}:null; }).filter(Boolean);
    storeSet(LAYOUT_KEY, JSON.stringify(out));
  }
  function load(list){
    loading=true;
    grid.removeAll(true);
    /* removeAll 이 DOM 을 다 못 지우는 경우가 있어(정적 격자 상태) 남은 카드를 직접 치운다 */
    Array.prototype.slice.call(document.querySelectorAll('#grid > .grid-stack-item')).forEach(function(e){ e.remove(); });
    Object.keys(INST).forEach(function(k){ delete INST[k]; });
    list.forEach(addInst); loading=false; save();
  }
  grid.on('change', save);
  grid.on('removed', save);
  grid.on('resizestop', function(e, el){ var id=el&&el.getAttribute('gs-id'); if(id&&INST[id]) renderOne(INST[id]); });

  var saved=null; try{ saved=JSON.parse(storeGet(LAYOUT_KEY)||'null'); }catch(e){}
  load(Array.isArray(saved) && saved.length ? saved : fromPreset('normal'));

  /* ── 꾸미기 ── */
  function setEditing(on){ document.body.classList.toggle('editing', on); grid.setStatic(!on); $('btnEdit').classList.toggle('on', on); $('btnEdit').innerHTML = on ? ic('check')+'완료' : ic('pencil')+'꾸미기'; }
  setEditing(false);
  $('btnEdit').onclick=function(){ if(isMobile()) return; setEditing(!document.body.classList.contains('editing')); };
  $('addList').innerHTML = Object.keys(W).map(function(t){ return '<button class="chip" data-t="'+t+'">'+ic(W[t].icon || t)+esc(W[t].title)+'</button>'; }).join('');
  $('addList').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ var t=b.getAttribute('data-t'); addInst({type:t, w:W[t].w, h:W[t].h}); save();
    var last=document.querySelector('.grid-stack-item[gs-id]:last-child'); if(last && last.scrollIntoView) last.scrollIntoView({behavior:'smooth', block:'center'}); }; });
  $('btnReset').onclick=function(){ if(confirm('처음 배치(평상시)로 되돌릴까요? 지금 꾸민 배치는 사라집니다')) load(fromPreset('normal')); };
  $('selPreset').onchange=function(){ var v=this.value, nm=this.options[this.selectedIndex].text; this.value=''; if(!v) return;
    if(confirm('기본 배치 "'+nm+'"를 불러올까요? 지금 꾸민 배치는 사라집니다')) load(fromPreset(v)); };

  /* ── 갱신 ── 60초마다 새 데이터. 자료 신선도 점: 40분 넘게 안 바뀌면 주황 */
  function updStamp(){
    var u=D().updated||'', el=$('upd'), tx=el.querySelector('span'); if(!u){ tx.textContent='자료 없음'; el.classList.add('old'); return; }
    var t=new Date(u.replace(' ','T')+'+09:00'), m=Math.round((Date.now()-t.getTime())/60000);
    tx.textContent=u.slice(5,16).replace('-','/')+' 갱신'+(isNaN(m)?'':' · '+(m<1?'방금':m+'분 전'));
    el.classList.toggle('old', m>40); el.title = m>40 ? '자료가 '+m+'분째 바뀌지 않았습니다' : '자료가 최신입니다';
  }
  function poll(){
    try{
      fetch('data.js?_t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(t){
        if(!t) return; var i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0||j<0) return;
        try{
          window.DASHBOARD_DATA = JSON.parse(t.slice(i,j+1));
          try{ if(SIT.sim) SIT.applySim(window.DASHBOARD_DATA); }catch(e){ if(window.console) console.error(e); }
          try{ SIT.observe(); }catch(e){ if(window.console) console.error(e); }
          renderAll(); SIT.loadNotes();
        }catch(e){ if(window.console) console.error(e); }
      }).catch(function(){});
    }catch(e){}
  }
  fillSelects();
  try{ if(SIT.sim) SIT.applySim(D()); }catch(e){ if(window.console) console.error(e); }
  try{ SIT.observe(); }catch(e){ if(window.console) console.error(e); }
  renderAll(); SIT.loadNotes();
  setInterval(function(){ try{ SIT.renderBar(); }catch(e){} }, 30000);
  setInterval(poll, 60000); setInterval(updStamp, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
  window.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz=setTimeout(renderAll, 200); });
  try{ if(RC.sidoList && RC.sidoCurrent){ var me=RC.sidoList.filter(function(x){ return x.label===RC.sidoCurrent; })[0]; if(me) storeSet('ggSido', me.base); } }catch(e){}
  window.DASHW = { W:W, grid:grid, INST:INST, render:renderAll, load:load, preset:fromPreset, SIT:SIT,   /* 점검용 */
    sim:function(on){
      try{ sessionStorage.removeItem('ggDashSimEnd'); }catch(e){}
      if(on) clearSimKeys();   /* 새 모의 훈련은 처음부터 */
      var u=new URL(location.href); if(on) u.searchParams.set('sim','1'); else u.searchParams.delete('sim'); location.href=u.toString(); } };
  $('btnSim').onclick=function(){ window.DASHW.sim(!SIT.sim); };
  if(SIT.sim) $('btnSim').textContent='모의 끝내기';
})();
</script>
</body>
</html>
