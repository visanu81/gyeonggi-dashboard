<title>상황판</title>
<!-- 위젯 상황판 (2026-11-11 사장님 지시 "한 화면에 대시보드, 원하는 정보를 골라 위젯처럼 구성")
     2026-11-12 디자인 손질(unslop) — 방향: 야간 근무 중인 소방 상황실. 바탕은 무채색, 색은 경보·주의·정상의 '뜻'에만,
       파란 강조색은 선택된 것에만. 눈에 띄는 곳은 둘 — 가운데 큰 지도, 수위표처럼 그린 하천 수위. 고유 표시는 갱신 시각 옆 '자료 신선도 점' 하나.
     · 데이터·설정은 다른 화면과 같은 파일(region.js · data.js · map-geo.js) — 빌드(build_weather_dev.py)가 운영 주소로 바꿔 끼운다
     · 배치는 이 브라우저에만 저장(localStorage 'ggDash.v2.<시도키>'), '내 관서'는 다른 화면과 같은 값(ggMyStation)
     · 격자: gridstack 10.3.1 (MIT, gridstack-all.js 저장소에 동봉 — 관공서 망에서 외부 CDN 차단 대비)
     · 아이콘: lucide (ISC) 경로를 아래 ICON 표에 직접 넣음
     2026-11-12 상황 모드 — 상황 띠(특보·강한 비·하천 이상일 때만 위에 뜸) · 상황 기록(시간순 경과) · 상황보고(복사용 문구)
     · 판단은 사람이 한다 — 화면은 사실(발효·넘음)과 기준 통과만 적고, 권고·지시 문구는 쓰지 않는다
     · 강수 기준 통과(5/20/30/50mm)는 이 화면이 열려 있는 동안만 기록(이 브라우저 저장). 서버 기록은 2차
     · ?sim=1 모의 훈련 — 특보·강수·하천 수위를 모의 자료로 바꿔 보여 준다(실제 기록과 저장 키를 분리, 출동 메모는 안 읽음)
     2026-11-12 지금 점검할 곳 — 위험구역 구글시트(관서 탭)를 지금 강수·하천 값과 겹쳐 먼저/다음/평소로 나눔
     · 기준은 CHECK_RULES 한 곳, 확인 표시는 이 브라우저에만(24시간)
     2026-11-12 대응 체크리스트: 평시·주의·경보 단계별 할 일, 항목은 화면에서 직접 편집(기본값은 '예시' 표시)
     · 목록·체크는 이 브라우저에만 저장(목록 복사·붙여넣기로 다른 PC에 옮김), 체크하면 상황 기록·상황보고에 반영
     2026-11-12 사후 보고: 상황이 진행되는 동안 최고 단계·최대 강수·최고 수위·조치 진행을 기록해 두었다가(run record) 정상으로 돌아오면 '끝난 상황'으로 7일 보관, 상황보고 위젯 '사후' 양식과 '상황 종료' 띠에서 초안 복사
     · 화면이 열려 있던 동안의 기록이라는 한계를 문구에 적는다
     · 서버 사건 기록(2026-11-13): 자료에 events·warnings[].since 가 있으면 그것을 우선 쓰고(화면이 닫혀 있던 동안의 강수·수위·특보 변화가 채워짐), 없으면 예전처럼 화면이 본 것만
     · 출동 메모 위젯: 열쇠 정하기/넣기, 기록·삭제 — 쉬운 화면과 같은 저장소·같은 열쇠 -->

<script src="risk-zones.js"></script>
<script src="map-geo.js"></script>

/* ── 색 ── 무채색(graphite) 한 줄 + 뜻 있는 색 셋 + 강조색 하나 */
:root{
  --page:#f4f4f5; --card:#ffffff; --raised:#f4f4f5; --deep:#e9e9eb; --mapEmpty:#e4e4e7;
  --line:rgba(23,23,23,.08); --line2:rgba(23,23,23,.14);
  --ink:#171717; --ink2:#525252; --ink3:#737373;
  --accent:#2563eb; --accentSoft:rgba(37,99,235,.10);
  --safe:#16a34a; --warn:#c2620a; --severe:#dc2626;
  --safeSoft:rgba(22,163,74,.12); --warnSoft:rgba(194,98,10,.12); --severeSoft:rgba(220,38,38,.12);
  --warnFill:#f59e0b; --severeFill:#ef4444;
  --rain1:#dbeafe; --rain2:#93c5fd; --rain3:#3b82f6; --rain4:#1d4ed8;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#141415; --card:#19191b; --raised:#232325; --deep:#0f0f10; --mapEmpty:#2a2a2d;
  --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.14);
  --ink:#ededed; --ink2:#a1a1a6; --ink3:#85858b;
  --accent:#5b8def; --accentSoft:rgba(91,141,239,.16);
  --safe:#4cc38a; --warn:#f5a524; --severe:#f16a6e;
  --safeSoft:rgba(76,195,138,.14); --warnSoft:rgba(245,165,36,.16); --severeSoft:rgba(229,72,77,.18);
  --warnFill:#d98a14; --severeFill:#e5484d;
  --rain1:#1e2b44; --rain2:#25467a; --rain3:#3b6fd0; --rain4:#7aa7ff;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --page:#141415; --card:#19191b; --raised:#232325; --deep:#0f0f10; --mapEmpty:#2a2a2d;
  --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.14);
  --ink:#ededed; --ink2:#a1a1a6; --ink3:#85858b;
  --accent:#5b8def; --accentSoft:rgba(91,141,239,.16);
  --safe:#4cc38a; --warn:#f5a524; --severe:#f16a6e;
  --safeSoft:rgba(76,195,138,.14); --warnSoft:rgba(245,165,36,.16); --severeSoft:rgba(229,72,77,.18);
  --warnFill:#d98a14; --severeFill:#e5484d;
  --rain1:#1e2b44; --rain2:#25467a; --rain3:#3b6fd0; --rain4:#7aa7ff;
  --shadow:none;
}

/* ── 바탕 ── */
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  font-size:14px;line-height:20px;font-feature-settings:'tnum';font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ── 윗줄 ── 높이 56, 좌우 24 */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 24px;background:var(--page);border-bottom:1px solid var(--line)}
.top h1{margin:0 8px 0 0;font-size:16px;line-height:20px;font-weight:600;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
.top select,.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.top select:hover,.btn:hover{border-color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500}
.btn.icon{width:32px;padding:0;justify-content:center;color:var(--ink2)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.quiet:hover{color:var(--ink);border-color:transparent;background:var(--raised)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn:active{transform:scale(.98)}
.fresh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);white-space:nowrap}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--safe);flex:none}
.fresh.old i{background:var(--warn)}
.fresh.old{color:var(--warn)}
.sp{flex:1}

/* ── 꾸미기 줄 ── */
.editbar{display:none;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card)}
body.editing .editbar{display:flex}
.editbar .lb{font-size:13px;color:var(--ink2);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);font-size:13px;cursor:pointer;
  transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.chip .ic{color:var(--ink3)}
.chip:hover{border-color:var(--ink3)}
.editbar .note{margin-left:auto;font-size:12px;color:var(--ink3)}

/* ── 격자와 카드 ── 카드 사이 16, 페이지 가장자리 24 */
#grid{margin:8px 16px 40px}
.grid-stack-item-content{display:flex;flex-direction:column;overflow:hidden!important;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
body.editing .grid-stack-item-content{border-style:dashed;border-color:var(--line2)}
.wh{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;color:var(--ink2);font-size:13px;font-weight:500}
.wh .ic{color:var(--ink3)}
body.editing .wh{cursor:move}
.wh .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .meta{font-size:12px;color:var(--ink3);font-weight:400;white-space:nowrap}
.wh .x{display:none;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink3);cursor:pointer;align-items:center;justify-content:center}
.wh .x:hover{background:var(--severeSoft);color:var(--severe)}
body.editing .wh .x{display:inline-flex}
body.editing .wh .meta{display:none}
.wb{flex:1;min-height:0;overflow:auto;padding:0 16px 16px;font-size:13px}
.wb::-webkit-scrollbar{width:8px}.wb::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

/* 구간 선택 — 강조색이 아니라 면 한 단계 */
.seg{display:flex;width:fit-content;max-width:100%;gap:2px;padding:2px;margin-bottom:12px;border-radius:8px;background:var(--raised)}
.seg button{height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--ink3);font-size:12px;cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}

/* 공통 */
.muted{color:var(--ink3)}.sec{color:var(--ink2)}
.t-safe{color:var(--safe)}.t-warn{color:var(--warn)}.t-severe{color:var(--severe)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3)}
.dot.safe{background:var(--safe)}.dot.warn{background:var(--warn)}.dot.severe{background:var(--severe)}
.calm{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
.calm .dot{background:var(--safe)}

/* 내 관서 상태 */
.st{display:flex;flex-direction:column;gap:4px}
.st .who{font-size:13px;color:var(--ink2)}
.st .word{display:flex;align-items:center;gap:8px;font-size:28px;line-height:32px;font-weight:500}
.st .word .dot{width:12px;height:12px}
.st .why{font-size:13px;color:var(--ink2)}
.st .meta{font-size:12px;color:var(--ink3)}
.box-safe{} .box-warn .word{color:var(--warn)} .box-severe .word{color:var(--severe)}

/* 수치 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:100%}
.kpi{padding:0 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .k{font-size:13px;color:var(--ink2)}
.kpi .v{font-size:28px;line-height:32px;font-weight:500}
.kpi .v small{font-size:14px;color:var(--ink3);font-weight:400;margin-left:2px}
.kpi .s{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 목록 */
.list{display:flex;flex-direction:column}
.li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .h{display:flex;align-items:center;gap:8px}
.li .h b{font-weight:500}
.li .h .tm{margin-left:auto;font-size:12px;color:var(--ink3)}
.li .b{color:var(--ink2);font-size:13px}

/* 막대 줄 (강수) */
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:64px 1fr 48px;align-items:center;gap:8px;height:24px}
.bar-row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bar-row.me .n{color:var(--accent);font-weight:500}
.bar-row .v{text-align:right}
.track{position:relative;height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* 하천 수위표 — 주의·위험 눈금이 있는 막대. 평상시엔 회색, 주의부터 색이 오른다 */
.gauges{display:flex;flex-direction:column;gap:0}
.gauge{display:grid;grid-template-columns:minmax(96px,28%) 1fr 56px;align-items:center;gap:12px;height:40px}
.gauge .n{display:flex;flex-direction:column;min-width:0;line-height:16px}
.gauge .n b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .n span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .v{text-align:right;color:var(--ink2)}
.staff{position:relative;height:12px;border-radius:4px;background:var(--raised)}
.staff i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink3);opacity:.45}
.staff .tk{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px}
.staff .tk.w{background:var(--warn)}.staff .tk.d{background:var(--severe)}
.gauge.warn .staff i{background:var(--warnFill);opacity:1}.gauge.warn .v{color:var(--warn)}
.gauge.severe .staff i{background:var(--severeFill);opacity:1}.gauge.severe .v{color:var(--severe)}
.gauge.bad .staff{background:repeating-linear-gradient(135deg,var(--raised) 0 6px,transparent 6px 12px)}
.gauge.bad .v{color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .tkw{width:2px;height:12px;background:var(--warn)}.legend .tkd{width:2px;height:12px;background:var(--severe)}

/* 표 */
table.tb{width:100%;border-collapse:collapse}
.tb th{position:sticky;top:0;z-index:1;height:32px;background:var(--card);text-align:right;color:var(--ink3);font-size:12px;font-weight:400;border-bottom:1px solid var(--line)}
.tb td{height:32px;text-align:right;border-bottom:1px solid var(--line);color:var(--ink2)}
.tb th:first-child,.tb td:first-child{text-align:left;color:var(--ink)}
.tb th,.tb td{padding:0 8px}.tb th:first-child,.tb td:first-child{padding-left:0}.tb th:last-child,.tb td:last-child{padding-right:0}
.tb tr.me td{background:var(--accentSoft)}
.tb tr.me td:first-child{color:var(--accent);font-weight:500;padding-left:8px;border-radius:6px 0 0 6px}
.tb tr.me td:last-child{border-radius:0 6px 6px 0;padding-right:8px}

/* 기상 영상 — 어두운 틀 안에 */
.frame{display:flex;align-items:center;justify-content:center;height:calc(100% - 40px);border-radius:8px;background:var(--deep);overflow:hidden}
.frame img{max-width:100%;max-height:100%;object-fit:contain;display:block}
:root[data-theme="dark"] .frame img{filter:brightness(.82)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .frame img{filter:brightness(.82)} }

/* 6시간 예보 */
.fc{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:100%;align-items:end}
.fc .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--ink3)}
.fc .c .col{width:100%;max-width:28px;border-radius:4px 4px 2px 2px;background:var(--rain3)}
.fc .c .mm{color:var(--ink);font-size:13px}
.fc .c .hh{color:var(--ink2)}
.fc-flat{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px;text-align:center}
.fc-flat div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink3)}
.fc-flat b{font-weight:400;color:var(--ink2);font-size:13px}

/* 지도 */
.mapwrap{position:relative;height:calc(100% - 40px);display:flex;flex-direction:column}
.mapwrap svg{flex:1;min-height:0;width:100%}
.mapwrap path{transition:fill .3s var(--ease)}
.mapwrap path:hover{filter:brightness(1.08)}

/* 상황 띠 — 상황이 있을 때만. 색은 경보·주의의 옅은 면 */
.sitbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;min-height:48px;padding:8px 24px;border-bottom:1px solid var(--line);font-size:13px}
.sitbar[hidden]{display:none}
.sitbar.severe{background:var(--severeSoft)}.sitbar.warn{background:var(--warnSoft)}
.sitbar .lab{font-weight:600}.sitbar .hl{font-weight:500;min-width:0;overflow-wrap:anywhere}.sitbar .since{color:var(--ink2)}
.sitbar .tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--ink2);font-size:12px;font-weight:500}
.sitbar.ended{background:var(--raised)}
.repnote{margin-bottom:8px;color:var(--ink3);font-size:12px}
.btn:disabled{opacity:.5;pointer-events:none}

/* 상황 기록 · 상황보고 */
.tlctl,.repctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.tlctl .seg,.repctl .seg{margin-bottom:0}
.repctl .btn{margin-left:auto}
.tlnote{display:flex;gap:8px;margin-bottom:12px}
.tlnote input{flex:1;min-width:0;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);font:inherit;font-size:13px}
.tlnote input::placeholder{color:var(--ink3)}
.tlday{padding:8px 0 4px;font-size:12px;color:var(--ink3)}
.tlrow{display:grid;grid-template-columns:48px 8px minmax(0,1fr);gap:8px;padding:8px 0}
.tlrow.hasx{grid-template-columns:48px 8px minmax(0,1fr) 24px}
.tlrow+.tlrow{border-top:1px solid var(--line)}
.tlrow .tm{font-size:12px;color:var(--ink3)}
.tlrow .tld{display:flex;align-items:center;height:20px}
.tlrow .t1{color:var(--ink);font-weight:400;overflow-wrap:anywhere}
.tlrow .t1.st{font-weight:500}
.tlrow .t2{color:var(--ink2);font-size:13px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlx{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink3);cursor:pointer}
.tlx:hover{background:var(--raised);color:var(--ink)}
pre.rep{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:20px;margin:0;padding:12px;border-radius:8px;background:var(--raised);color:var(--ink);user-select:text}

/* 출동 메모 */
.dsp-types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dsp-t{height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);font-size:13px;cursor:pointer;
  transition:border-color .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease)}
.dsp-t:hover{border-color:var(--ink3)}
.dsp-t.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.dsp-f{display:flex;flex-direction:column;gap:8px}
.dsp-in{display:block;width:100%;min-width:0;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);font:inherit;font-size:13px}
.dsp-in::placeholder{color:var(--ink3)}
.dsp-in:focus-visible{border-radius:8px}
.dsp-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dsp-row .dsp-sub{min-width:0}
.dsp-row .btn{flex:none}
.dsp-sub{font-size:12px;line-height:16px;color:var(--ink3)}
.dsp-sub.m{margin:8px 0 12px}
.dsp-msg{margin-top:0;font-size:12px;line-height:16px;color:var(--ink3);overflow-wrap:anywhere}
.dsp-msg.err{color:var(--severe)}
.dsp-msg:empty{display:none}
.dsp-key+.dsp-msg{margin-top:8px}
.dsp-h{margin:16px 0 4px;font-size:12px;line-height:16px;color:var(--ink3)}
.dsp-fail{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--severe)}
.dsp-r{display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:start;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.dsp-h+.dsp-r{border-top:0}
.dsp-b{min-width:0}
.dsp-l1{display:flex;align-items:baseline;gap:8px}
.dsp-tm{font-size:12px;color:var(--ink3);white-space:nowrap}
.dsp-ty{font-weight:500}
.dsp-tx{color:var(--ink2);font-size:13px;overflow-wrap:anywhere}

/* 지금 점검할 곳 */
.ckh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.ckh .live{margin-left:auto;font-size:12px;color:var(--ink3)}
.cks{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink3)}
.cks.n0{margin-top:0}
.cks.first{color:var(--severe)}.cks.next{color:var(--warn)}
.cks .btn{margin-left:auto}
.ckr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cks+.ckr{border-top:0}
.ckr.c{padding:4px 0}
.ckl{min-width:0}
.ck1{min-width:0;color:var(--ink2);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck1 .ckt{color:var(--ink);font-weight:500}
.ck2{font-size:12px;line-height:16px;overflow-wrap:anywhere}
.ck2.first{color:var(--severe)}.ck2.next{color:var(--warn)}
.ckrt{display:flex;align-items:center;gap:8px}
.btn.ckb{height:28px;padding:0 8px}
.ckrt .done{font-size:12px;color:var(--ink3);white-space:nowrap}
.ckmb{padding:4px 0 0}
.ckh.w{margin-bottom:4px}
.ckw{margin-bottom:12px;font-size:12px;line-height:16px}
.ckw.first{color:var(--severe)}.ckw.next{color:var(--warn)}

/* 대응 체크리스트 */
.tdh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.tdh .cur{display:flex;align-items:center;gap:8px;min-width:0}
.tdh .lb{font-size:12px;color:var(--ink3)}
.tdh b{font-size:14px;font-weight:500}
.tdh .prog{font-size:12px;color:var(--ink3);white-space:nowrap}
.tdex{margin-bottom:8px;font-size:12px;color:var(--ink3)}
.tdl{display:flex;flex-direction:column}
.tdr{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;margin:0;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tdr:first-child{border-top:0}
.tdbox{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);color:var(--card);transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.tdbox .ic{width:12px;height:12px}
.tdr:hover .tdbox{border-color:var(--ink3)}
.tdr.on .tdbox{background:var(--ink);border-color:var(--ink)}
.tdt{min-width:0;font-size:13px;line-height:20px;overflow-wrap:anywhere}
.tdr.on .tdt{color:var(--ink3)}
.tdt .ex{margin-left:4px;font-size:12px;color:var(--ink3)}
.tdtm{font-size:12px;line-height:20px;color:var(--ink3);white-space:nowrap}
.tdf{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tde{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;align-items:center;margin-bottom:8px}
.tda{display:flex;gap:8px}
.tdin{flex:1;min-width:0;width:100%;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);font:inherit;font-size:13px}
.tdin::placeholder{color:var(--ink3)}
.tdin:focus-visible{border-radius:8px}
.tda .btn{flex:none}
.tdx{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink3);cursor:pointer}
.tdx:hover{background:var(--raised);color:var(--ink)}

/* 휴대폰 */
@media (max-width:760px){
  .sitbar{padding:8px 16px}
  .top{flex-wrap:wrap;padding:8px 16px;gap:8px}.top h1{width:100%;margin:0}
  .hide-m{display:none!important}
  #grid{margin:8px 8px 32px}
  #grid.grid-stack{display:flex!important;flex-direction:column;gap:12px;height:auto!important}
  #grid>.grid-stack-item{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;min-height:0!important}
  #grid>.grid-stack-item>.grid-stack-item-content{position:relative!important;inset:auto!important;left:0!important;right:0!important;top:0!important;bottom:0!important}
  #grid>.grid-stack-item .wb{max-height:64vh}
  #grid>.grid-stack-item[data-t="map"] .wb{height:440px;max-height:none}
  #grid>.grid-stack-item[data-t="image"] .wb{height:420px;max-height:none}
  #grid>.grid-stack-item[data-t="riverTrend"] .wb{height:280px}
  #grid>.grid-stack-item[data-t="fcst"] .wb{height:200px}
  #grid>.grid-stack-item>.ui-resizable-handle{display:none!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}
  .kpi:nth-child(3){border-left:0;padding-left:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<body>
<div class="top">
  <h1 id="ttl">상황판</h1>
  <select id="selSido" style="display:none" aria-label="시도"></select>
  <label class="ctl">내 관서 <select id="selStation" aria-label="내 관서"></select></label>
  <span class="fresh" id="upd"><i></i><span>—</span></span>
  <span class="sp"></span>
  <select id="selPreset" class="hide-m" aria-label="기본 배치 불러오기">
    <option value="">기본 배치</option>
    <option value="normal">평상시</option>
    <option value="incident">상황 대응</option>
    <option value="rain">호우 대응</option>
    <option value="river">하천 감시</option>
    <option value="all">전부 보기</option>
  </select>
  <button class="btn hide-m" id="btnEdit"></button>
  <button class="btn icon" id="btnTheme" aria-label="밝게/어둡게" title="밝게/어둡게"></button>
  <a class="btn quiet" href="지도.html">지도 화면</a>
</div>
<div class="editbar">
  <span class="lb">위젯 추가</span><span id="addList" style="display:contents"></span>
  <span class="note">제목 줄을 끌어 옮기고 모서리로 크기 조절 · 이 브라우저에 저장</span>
  <button class="chip" id="btnSim" title="가짜 호우 상황을 띄워 상황 띠·상황 기록·상황보고를 미리 봅니다">모의 훈련</button>
  <button class="chip" id="btnReset"></button>
</div>
<div class="sitbar" id="sitbar" hidden></div>
<div class="grid-stack" id="grid"></div>

<script>
(function(){
  'use strict';

  var memStation = null;
  function D(){ return window.DASHBOARD_DATA || {}; }

  /* ── 아이콘 (lucide 16px, 선 1.5) ── */
  var P = {
    status:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',

    rain:'<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>',

    messages:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    fire:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',

    reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',

    plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',

    checklist:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    todo:'<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    siren:'<path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/>'
  };
  function ic(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(P[k]||'')+'</svg>'; }
  $('btnTheme').innerHTML = ic('contrast');
  $('btnReset').innerHTML = ic('reset')+'처음 배치로';

  /* ── 테마 (다른 화면과 같은 저장값) ── */
  function applyTheme(){ var t=storeGet('ggTheme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();
  $('btnTheme').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

        out.push({ts:hs[i].ts, kind:'river', lv:lv, text:text, sub:num(hs[i].v,2)+'m · 기준 '+num(th,1)+'m', code:r.code, sigun:r.sigun, up:up, key:'r|'+r.code+'|'+hs[i].ts+'|'+lv});
      }
    });
    (d.messages||[]).forEach(function(m){
      var ts=msgTs(m); if(ts==null) return;
      out.push({ts:ts, kind:'msg', lv:'info', text:'재난문자 · '+(m.sender||m.region||''), sub:m.text||'', region:m.region, key:'m|'+(m.sn||ts)});
    });
    if(srv){ var mg=srvDedup(SIT.srvList(), out); out=mg.loc.concat(mg.srv); }
    return out;
  };

  /* 이 화면이 열려 있는 동안 본 일 — 이 브라우저에 7일 */
  SIT.logRead = function(){ var a=jget(sk('ggDashLog.v1.'), []); return Array.isArray(a) ? a : []; };
  SIT.logWrite = function(arr){
    var cut=Date.now()-7*86400000;
    arr = arr.filter(function(e){ return e && e.ts>=cut; }).sort(function(a,b){ return b.ts-a.ts; }).slice(0,400);
    storeSet(sk('ggDashLog.v1.'), JSON.stringify(arr));
  };
  SIT.logAdd = function(evs){
    var arr=SIT.logRead(), have={}; arr.forEach(function(e){ have[e.key]=1; });
    evs.forEach(function(e){ if(!have[e.key]){ have[e.key]=1; arr.push(e); } });
    SIT.logWrite(arr);
  };
  /* 보여 줄 기록 — 서버 기록이 있으면, 같은 강수 기준 통과를 서버 줄이 이미 알리는 옛 기록은 숨긴다(저장된 것은 그대로) */
  SIT.logShown = function(){
    var arr=SIT.logRead();
    if(!hasSrv()) return arr;
    var sr=SIT.srvList().filter(function(e){ return e.kind==='rain'; });
    if(!sr.length) return arr;
    return arr.filter(function(e){ return !(e && e.kind==='rain' && srvRainDup(e, sr, sigunOf)); });
  };
  SIT.addNote = function(text){
    text = String(text||'').trim(); if(!text) return;
    var ts=Date.now(); SIT.logAdd([{ts:ts, kind:'note', lv:'info', text:text, where:[stationNow()], key:'n|'+ts}]);
  };
  SIT.delNote = function(key){ SIT.logWrite(SIT.logRead().filter(function(e){ return e.key!==key; })); };
  var RAIN_BANDS=[5,20,30,50];
  function bandOf(v){ var b=0; RAIN_BANDS.forEach(function(t,i){ if(v!=null && v>=t) b=i+1; }); return b; }
  SIT.observe = function(){
    var pk=sk('ggDashPrev.v1.'), prev=jget(pk, null), cur={rain:{}, lv:{}}, evs=[], now=Date.now(), hr=Math.floor(now/3600000);
    ORDER.forEach(function(st){ var reg=regOf(st); cur.rain[st]=bandOf(rain1h(reg)); cur.lv[st]=statusOf(st).lv; });
    if(prev && prev.rain){
      ORDER.forEach(function(st){
        var pb=prev.rain[st], nb=cur.rain[st]; if(pb==null) return;
        var reg=regOf(st), v=rain1h(reg), sub='1시간 '+num(v,1)+'mm · 오늘 '+num(rainDay(reg),1)+'mm';
        if(nb>pb){ var th=RAIN_BANDS[nb-1];
          evs.push({ts:now, kind:'rain', lv:th>=20?'severe':'warn', text:st+' 시간당 '+th+'mm 넘음', sub:sub, where:[st], key:'p|'+st+'|'+th+'|'+hr}); }
        else if(pb>=1 && nb===0){
          evs.push({ts:now, kind:'rain', lv:'clear', text:st+' 시간당 5mm 아래로', sub:sub, where:[st], key:'p|'+st+'|clear|'+hr}); }
      });
      if(evs.length && !hasSrv()) SIT.logAdd(evs);   /* 서버 기록이 있으면 강수 기준 통과는 서버 줄을 쓴다 */
    }
    storeSet(pk, JSON.stringify(cur));
    try{ SIT.warnSeenUpdate(); }catch(e){ if(window.console) console.error(e); }
    try{ SIT.track(); }catch(e){ if(window.console) console.error(e); }
  };

  /* 출동 메모 저장소와 말하는 길 — 상황 기록(읽기)과 출동 메모 위젯(쓰기·지우기)이 함께 쓴다. 쉬운 화면과 같은 서비스·같은 열쇠(ggDspKey) */
  var DSPX = { stat:null, statAt:0, statBusy:false, statQ:[], setupBusy:false };
  DSPX.room = function(){ return (RC.key==='north'||RC.key==='south') ? 'all' : (RC.key||'all'); };
  /* 요청 하나 — 15초 안에 답이 없으면 실패로 끝낸다. cb(ok, json, httpCode) 는 정확히 한 번, 던지지 않는다. body 가 있으면 POST */
  DSPX.call = function(path, body, cb){
    var fin=false, timer=null, code=0;
    var done=function(j, ok){
      if(fin) return; fin=true; clearTimeout(timer);
      try{ cb(ok, j, code); }catch(e){ if(window.console) console.error(e); }
    };
    timer=setTimeout(function(){ done(null, false); }, 15000);
    try{
      var opt=body ? {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'};
      fetch(DSP_BASE+path, opt).then(function(r){ code=r.status; return r.json(); }).then(function(j){ done(j, true); }).catch(function(){ done(null, false); });
    }catch(e){ done(null, false); }
  };
  /* 방 열쇠와 지금 열쇠를 실어 보낸다 */
  DSPX.send = function(path, body, cb){
    body.key=DSPX.room(); if(body.code===undefined) body.code=storeGet('ggDspKey') || '';
    DSPX.call(path, body, cb);
  };
  /* 이 방에 열쇠가 정해져 있는가 — 5분 보관(읽지 못한 때는 1분 뒤 다시). cb(status|null) */
  DSPX.fresh = function(){ return !!DSPX.statAt && Date.now()-DSPX.statAt < (DSPX.stat ? 300000 : 60000); };
  DSPX.status = function(cb){
    if(DSPX.fresh()){ if(cb) cb(DSPX.stat); return; }
    if(cb) DSPX.statQ.push(cb);
    if(DSPX.statBusy) return;
    DSPX.statBusy=true;
    DSPX.call('/api/status?key='+encodeURIComponent(DSPX.room()), null, function(ok, j){
      DSPX.statBusy=false;
      DSPX.stat=(ok && j && j.ok) ? j : null; DSPX.statAt=Date.now();
      var q=DSPX.statQ; DSPX.statQ=[];
      q.forEach(function(f){ try{ f(DSPX.stat); }catch(e){ if(window.console) console.error(e); } });
    });
  };
  /* 열쇠 정하기·넣기 */
  DSPX.setup = function(cb){
    if(SIT.sim || DSPX.setupBusy) return;
    if(storeGet('ggDspKey') && !SIT.notesFail) return;   /* 이미 연결돼 있다 */
    DSPX.setupBusy=true;
    var end=function(){ DSPX.setupBusy=false; };
    var ok=function(){ end(); SIT.notesAt=0; SIT.notesFail=false; SIT.loadNotes(true); renderAll(); if(cb) cb(); };
    DSPX.status(function(s){
      if(!s){ end(); alert('연결하지 못했습니다'); return; }
      var v;
      if(s.locked===false){
        v=prompt('출동 메모 열쇠를 새로 정합니다 (4자 이상, 관서에서 함께 쓸 암호)');
        v=(v==null) ? '' : String(v).trim();
        if(!v){ end(); return; }
        if(v.length<4){ end(); alert('열쇠는 4자 이상으로 정해 주세요'); return; }
        DSPX.send('/api/code', {code:'', next:v}, function(good, j){
          if(good && j && j.ok){ storeSet('ggDspKey', v); DSPX.stat={ok:true, count:0, last:null, locked:true}; DSPX.statAt=Date.now(); ok(); }
          else { end(); alert((good && j && j.why) ? j.why : '연결하지 못했습니다'); }
        });
      } else {
        v=prompt('출동 메모 열쇠를 넣으세요 (관서에서 함께 쓰는 암호)');
        v=(v==null) ? '' : String(v).trim();
        if(!v){ end(); return; }
        storeSet('ggDspKey', v);
        DSPX.call('/api/notes?key='+encodeURIComponent(DSPX.room())+'&days=1&code='+encodeURIComponent(v), null, function(good, j){
          if(good && j && j.ok){ ok(); return; }
          storeDel('ggDspKey'); end();
          alert(good ? '열쇠가 맞지 않습니다' : '연결하지 못했습니다');
        });
      }
    });
  };
  /* 출동 메모에 함께 남기는 '지금 값' — 쉬운 화면과 같은 칸(rn60·rnday·river·warn·gust·updated). 이 화면에 값이 없는 칸은 뺀다 */
  DSPX.wx = function(st){
    var reg=regOf(st), aws=((reg||{}).detail||{}).aws||{}, r1=rain1h(reg), rd=rainDay(reg), wx={}, types=[];
    if(r1!=null && !isNaN(r1)) wx.rn60=+r1.toFixed(1);
    if(rd!=null && !isNaN(rd)) wx.rnday=+rd.toFixed(1);
    var rv=riversOf(st).filter(function(r){ return r.danger && !riverBad(r) && r.value!=null && !isNaN(+r.value); }).sort(function(a,b){ return riverPctRaw(b)-riverPctRaw(a); })[0];
    if(rv) wx.river=riverName(rv)+' '+num(rv.value,2)+'m('+Math.round(riverPctRaw(rv)*100)+'%)';
    statusOf(st).warns.forEach(function(w){ if(w.type && types.indexOf(w.type)<0) types.push(w.type); });
    if(types.length) wx.warn=types.join('·');
    var gust=(aws.wind && aws.wind.wss!=null) ? aws.wind.wss : (aws.wss!=null ? aws.wss : null);
    if(gust!=null && !isNaN(+gust)) wx.gust=+(+gust).toFixed(1);
    if(D().updated) wx.updated=String(D().updated);
    return wx;
  };

  /* 출동 메모 읽기 — 최근 7일, 이 방 전체(관서별로 거르는 건 보여 주는 쪽에서) */
  SIT.loadNotes = function(force){
    if(SIT.sim) return;
    var code=storeGet('ggDspKey');
    if(!code){ SIT.notes=null; SIT.notesFail=false; return; }
    if(SIT.notesBusy){ if(force) SIT.notesAgain=true; return; }   /* 받는 중이면 끝난 뒤 한 번 더 */
    if(!force && Date.now()-SIT.notesAt < 300000) return;
    SIT.notesBusy=true; SIT.notesAt=Date.now();
    var room=DSPX.room();
    var fin=false, timer=null;
    var again=function(){ if(SIT.notesAgain){ SIT.notesAgain=false; SIT.loadNotes(true); } };
    var done=function(){ if(fin) return; fin=true; clearTimeout(timer); SIT.notesBusy=false; renderAll(); again(); };
    /* 응답이 15초 넘게 없으면 쉬는 표시를 풀어 다음 새로고침이 막히지 않게 한다. 그 뒤에 늦게 온 응답은 무시 */
    timer=setTimeout(function(){ if(fin) return; fin=true; SIT.notesBusy=false; again(); }, 15000);
    try{
      fetch(DSP_URL+'?key='+encodeURIComponent(room)+'&days=7&code='+encodeURIComponent(code)).then(function(r){ return r.json(); }).then(function(j){
        if(fin) return;
        if(j && j.ok){ SIT.notes=j.notes||[]; SIT.notesFail=false; } else { SIT.notes=null; SIT.notesFail=true; }
        done();
      }).catch(function(){ done(); });
    }catch(e){ fin=true; clearTimeout(timer); SIT.notesBusy=false; }
  };
  SIT.askKey = function(){ DSPX.setup(); };
  SIT.dispatchEvents = function(){
    return (SIT.notes||[]).map(function(n){
      return {ts:n.ts, kind:'dispatch', lv:'info', text:'출동 · '+n.type, sub:[n.station, n.place, n.memo].filter(Boolean).join(' · '), where:[n.station], dtype:n.type, place:n.place||'', key:'d|'+n.id};
    });
  };

  function mineHit(e, stn){
    var st=stn||stationNow(), sg=sigunOf(st);
    if(e.where && e.where.some(function(w){ return w===st || w===sg || sigunOf(w)===sg; })) return true;
    if(e.area && areaHits(e.area, st)) return true;
    if(e.code!=null && riversOf(st).some(function(r){ return String(r.code)===String(e.code); })) return true;
    if(e.region && (e.region===sg || e.region===st)) return true;
    return false;
  }
  /* t0~t1 사이의 일(최신이 앞). stn 은 '내 관서' 판단에 쓸 관서(없으면 지금 고른 관서) */
  SIT.eventsBetween = function(scope, t0, t1, stn){
    var seen={};
    return SIT.derived().concat(SIT.logShown(), SIT.dispatchEvents()).filter(function(e){
      if(!e || e.ts==null || e.ts<t0 || e.ts>t1 || seen[e.key]) return false;
      seen[e.key]=1; return scope==='all' || mineHit(e, stn);
    }).sort(function(a,b){ return b.ts-a.ts; });
  };
  SIT.events = function(scope, hours){ return SIT.eventsBetween(scope, Date.now()-hours*3600000, Infinity); };

  /* 지금 상황이 있는가 — 내 관서(mine)와 전체(all) 두 줄을 따로 본다 */
  var RANK = {safe:0, warn:1, severe:2};
  SIT.levelOf = function(scope){
    if(simOver()) return {active:false, lv:'safe'};   /* 모의 상황이 끝났다 — 실제 자료로 모의 상황을 새로 만들지 않는다 */
    if(scope==='all'){
      var worst='safe'; ORDER.forEach(function(n){ var l=statusOf(n).lv; if(RANK[l]>RANK[worst]) worst=l; });
      return {active:worst!=='safe', lv:worst};
    }
    var lv=statusOf(stationNow()).lv; return {active:lv!=='safe', lv:lv};
  };
  /* 지금 자료로 본 상황 — 저장소는 건드리지 않는다. 내 관서가 주의 이상이면 mine, 아니고 다른 관서가 그렇다면 all */
  SIT.evalNow = function(){
    var st=stationNow(), res;
    if(simOver()) return {active:false, lv:'safe', scope:'mine', headline:''};
    var s=statusOf(st), wordOf={warn:'주의', severe:'경보'};
    if(s.lv!=='safe'){
      res={active:true, lv:s.lv, scope:'mine', headline:st+' '+(s.lv==='severe'?'경보':'주의')+' · '+s.why.slice(0,3).join(' · ')};
    } else {
      var bad=ORDER.filter(function(n){ return statusOf(n).lv!=='safe'; });
      if(bad.length){
        var worst=bad.some(function(n){ return statusOf(n).lv==='severe'; }) ? 'severe' : 'warn';
        res={active:true, lv:worst, scope:'all', headline:(RC.label||'')+' '+bad.length+'개 관서 주의 이상 · '+bad.slice(0,3).map(function(n){ return n+' '+wordOf[statusOf(n).lv]; }).join(', ')+(bad.length>3?' 외':'')};
      } else res={active:false, lv:'safe', scope:'mine', headline:''};
    }
    return res;
  };
  /* 상황이 시작된 때 — 지금 특보 발표(없으면 처음 본) 시각·지금 주의 이상인 하천이 수위를 넘은 가장 최근 시각·지금 중 가장 이른 때 */
  SIT.sinceOf = function(scope){
    var st=stationNow(), mine=scope==='mine', times=[Date.now()];
    (mine ? statusOf(st).warns : (D().warnings||[])).forEach(function(w){ times.push(SIT.warnTime(w, mine ? st : null).ts); });
    var curCodes={};
    (mine ? riversOf(st) : (D().rivers||[]).filter(function(r){ return !isDam(r); })).forEach(function(r){ var l=riverLv(r); if(l==='warn'||l==='severe') curCodes[String(r.code)]=1; });
    var lastUp=null;
    SIT.derived().forEach(function(e){ if(e.kind==='river' && e.up && curCodes[String(e.code)] && (lastUp==null || e.ts>lastUp)) lastUp=e.ts; });
    if(lastUp!=null) times.push(lastUp);
    return Math.min.apply(null, times);
  };
  /* 진행 중 기록(run record)과 가장 최근 끝난 상황 — 내 관서는 관서마다, 전체는 하나. 읽기만 한다(쓰는 곳은 SIT.track 과 닫기 버튼) */
  function runKey(kind, scope, stn){ return (kind==='last' ? 'ggDashSitLast.v1.' : 'ggDashSit.v1.')+(RC.key||'x')+'.'+scope+(scope==='mine' ? '.'+stn : '')+(SIT.sim ? '.sim' : ''); }
  SIT.run = function(scope){
    scope=scope==='all' ? 'all' : 'mine';
    var r=jget(runKey('run', scope, stationNow()), null); return (r && typeof r==='object' && r.since) ? r : null;
  };
  SIT.last = function(scope){
    scope=scope==='all' ? 'all' : 'mine';
    var r=jget(runKey('last', scope, stationNow()), null);
    if(!r || typeof r!=='object' || !r.since || !r.end || Date.now()-r.end>7*86400000) return null;
    return r;
  };
  SIT.dismiss = function(scope){
    scope=scope==='all' ? 'all' : 'mine';
    var l=SIT.last(scope); if(l){ l.dismissed=true; storeSet(runKey('last', scope, stationNow()), JSON.stringify(l)); }
  };
  SIT.state = function(){
    var res=SIT.evalNow();
    if(!res.active){ res.since=null; return res; }
    var rec=SIT.run(res.scope);
    res.since=rec ? rec.since : SIT.sinceOf(res.scope);
    return res;
  };

  /* 상황이 진행되는 동안의 기록 — observe 때마다 갱신한다. 상황이 끝나면 10분 넘었거나 경보였을 때만 '끝난 상황'으로 남긴다 */
  function sitFinish(rec, endTs, rk, lk){
    if(SIT.sim || endTs-rec.since>=600000 || rec.lvMax==='severe'){ rec.end=endTs; storeSet(lk, JSON.stringify(rec)); }
    storeDel(rk);
  }
  SIT.trackOne = function(scope, stn, now){
    var rk=runKey('run', scope, stn), lk=runKey('last', scope, stn), lv=SIT.levelOf(scope), mine=scope==='mine', rec=jget(rk, null);
    if(rec && !(typeof rec==='object' && rec.since)) rec=null;
    if(rec){
      /* 화면이 30분 넘게 닫혀 있었다면 끝난 때는 마지막으로 본 때. 다시 켰을 때 시작 시각이 그 뒤라면 새 상황 */
      var stale=!!rec.lastSeen && now-rec.lastSeen>1800000, endTs=stale ? rec.lastSeen : now;
      if(!lv.active || (stale && SIT.sinceOf(scope)>rec.lastSeen)){ sitFinish(rec, endTs, rk, lk); rec=null; }
    }
    if(!lv.active) return;
    if(!rec){ rec={since:SIT.sinceOf(scope), scope:scope, lvMax:lv.lv, lastSeen:now, warns:[]}; if(mine) rec.station=stn; }
    rec.lastSeen=now;
    if(RANK[lv.lv]>RANK[rec.lvMax||'warn']) rec.lvMax=lv.lv;
    /* 특보 종류 — 처음 본 때(더 이른 시각이 나오면 그쪽으로) */
    rec.warns=rec.warns||[];
    (mine ? statusOf(stn).warns : (D().warnings||[])).forEach(function(w){
      if(!w.type) return;
      var wt=SIT.warnTime(w, mine ? stn : null), cur=null;
      rec.warns.forEach(function(x){ if(x.type===w.type) cur=x; });
      if(!cur) rec.warns.push({type:w.type, ts:wt.ts, src:wt.src});
      else if(wt.ts<cur.ts){ cur.ts=wt.ts; cur.src=wt.src; }
    });
    /* 최대 강수 — 내 관서는 그 관서만, 전체는 모든 관서(같은 시의 두 관서는 한 번만) */
    var seenSg={}, sts=mine ? [stn] : ORDER.filter(function(n){ var g=sigunOf(n); if(seenSg[g]) return false; seenSg[g]=1; return true; });
    sts.forEach(function(n){
      var reg=regOf(n), v=rain1h(reg), dv=rainDay(reg);
      if(v!=null && !isNaN(v) && v>0 && (!rec.r1 || v>rec.r1.v)) rec.r1={v:v, st:n, ts:now};
      if(dv!=null && !isNaN(dv) && dv>0 && (!rec.day || dv>rec.day.v)) rec.day={v:dv, st:n, d:fMD(now)};
    });
    /* 가장 높은 하천 수위(위험수위 대비) — 자료 이상은 뺀다 */
    (mine ? riversOf(stn) : (D().rivers||[]).filter(function(r){ return !isDam(r); })).forEach(function(r){
      if(riverBad(r) || !r.danger || r.value==null || isNaN(+r.value)) return;
      var pct=Math.round(riverPctRaw(r)*1000)/10;
      if(!rec.river || pct>rec.river.pct) rec.river={name:r.name||'', value:+r.value, danger:+r.danger, pct:pct, ts:now};
    });
    /* 조치 진행 — 내 관서만. 점검은 확인한 곳이 가장 많았던 때, 체크리스트는 가장 높은 단계에서 가장 많이 한 때 */
    if(mine){
      try{
        var pz=RISKZ.peek(stn);
        if(pz && pz.state==='ok'){
          var f1=checkZones(stn, pz.items, checkLive(stn)).filter(function(z){ return z.tier==='first'; });
          if(f1.length){ var cm=f1.filter(function(z){ return z.ts; }).length; if(!rec.chk || cm>=rec.chk.m) rec.chk={n:f1.length, m:cm}; }
        }
      }catch(x){}
      if(lv.lv==='warn' || lv.lv==='severe'){
        try{
          var tp=TODO.progress(lv.lv), od=rec.todo;
          if(tp && tp.n>0 && (!od || RANK[lv.lv]>RANK[od.stage] || (lv.lv===od.stage && tp.m>=od.m))) rec.todo={stage:lv.lv, n:tp.n, m:tp.m};
        }catch(x){}
      }
    }
    storeSet(rk, JSON.stringify(rec));
  };
  /* 다른 관서를 보다가 두고 온 내 관서 기록 — 30분 넘게 갱신이 없으면 마지막으로 본 때로 끝낸다 */
  SIT.sweep = function(now){
    var pre='ggDashSit.v1.'+(RC.key||'x')+'.mine.', cur=runKey('run', 'mine', stationNow()), ks=[], i, k;
    try{ for(i=0; i<localStorage.length; i++){ k=localStorage.key(i); if(k && k.indexOf(pre)===0) ks.push(k); } }catch(e){ return; }
    ks.forEach(function(key){
      if(key===cur || /\.sim$/.test(key)!==!!SIT.sim) return;
      var rec=jget(key, null);
      if(!rec || !rec.since || !rec.lastSeen || now-rec.lastSeen<=1800000) return;
      sitFinish(rec, rec.lastSeen, key, 'ggDashSitLast.v1.'+key.slice('ggDashSit.v1.'.length));
    });
  };
  SIT.track = function(){
    var now=Date.now();
    try{ SIT.sweep(now); }catch(e){ if(window.console) console.error(e); }
    try{ SIT.trackOne('mine', stationNow(), now); }catch(e){ if(window.console) console.error(e); }
    try{ SIT.trackOne('all', null, now); }catch(e){ if(window.console) console.error(e); }
  };
  /* 예전 형식(관서·범위 구분 없는 기록)은 지운다 */
  ['ggDashSit.v1.', 'ggDashSitLast.v1.'].forEach(function(b){ storeDel(b+(RC.key||'x')); storeDel(b+(RC.key||'x')+'.sim'); });

  /* 복사 */
  function copyText(t, btn){
    var done=function(){
      if(!btn) return; var o=btn.getAttribute('data-l'); if(o==null){ o=btn.textContent; btn.setAttribute('data-l', o); }
      btn.textContent='복사됨'; setTimeout(function(){ btn.textContent=o; }, 2000);
    };
    var fb=function(){
      try{ var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); if(ok) done(); }catch(e){}
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fb); } else fb();
  }

  /* 상황 띠 */
  SIT.renderBar = function(){
    var el=$('sitbar'); if(!el) return;
    var s=SIT.state(), ended=null, endSc='mine';
    if(!s.active){
      /* 끝난 상황 — 내 관서 것을 먼저, 없으면 전체 것. 6시간 안에 끝났고 닫지 않은 것만 */
      var okEnd=function(l){ return !!l && !l.dismissed && Date.now()-l.end<=6*3600000; };
      var lm=SIT.last('mine'), la=SIT.last('all');
      if(okEnd(lm)) ended=lm; else if(okEnd(la)){ ended=la; endSc='all'; }
    }
    if(!s.active && !SIT.sim && !ended){ el.hidden=true; el.innerHTML=''; el.className='sitbar'; return; }
    el.hidden=false; el.className='sitbar'+(s.active ? ' '+s.lv : (ended ? ' ended' : ''));
    var h='';
    if(SIT.sim) h+='<span class="tag">모의 훈련 자료</span>';
    if(s.active){
      var mn=Math.max(0, Math.floor((Date.now()-s.since)/60000)), hh=Math.floor(mn/60), mm=mn%60;
      h+='<span class="dot '+s.lv+'"></span><span class="lab">상황 진행 중</span><span class="hl">'+esc(s.headline)+'</span>'+
        '<span class="since">'+fHM(s.since)+'부터 · '+(hh ? hh+'시간 ' : '')+mm+'분째</span><span class="sp"></span>'+
        '<button class="btn" data-a="log">상황 기록</button><button class="btn" data-a="copy">보고 문구 복사</button>';
    } else if(ended){
      h+='<span class="dot"></span><span class="lab">상황 종료</span><span class="hl">'+esc(ended.scope==='all' ? (RC.label||'') : (ended.station||''))+' · 최고 '+(ended.lvMax==='severe' ? '경보' : '주의')+'</span>'+
        '<span class="muted">'+fMDHM(ended.since)+' ~ '+(dayStart(ended.end)===dayStart(ended.since) ? fHM(ended.end) : fMDHM(ended.end))+' · '+fDur(ended.end-ended.since)+'</span><span class="sp"></span>'+
        '<button class="btn" data-a="afcopy">사후 보고 복사</button><button class="btn" data-a="afclose">닫기</button>';
    } else h+='<span class="sp"></span>';
    if(SIT.sim && s.active) h+='<button class="btn" data-a="simend">모의 상황 종료</button>';
    if(SIT.sim) h+='<button class="btn" data-a="endsim">모의 끝내기</button>';
    el.innerHTML=h;
    var on=function(a, fn){ var b=el.querySelector('[data-a="'+a+'"]'); if(b) b.onclick=function(){ fn(b); }; };
    on('log', function(){
      var find=function(){ var f=null; Object.keys(INST).forEach(function(k){ if(INST[k].type==='timeline') f=INST[k]; }); return f; };
      var tl=find();
      if(!tl){ addInst({type:'timeline', w:W.timeline.w, h:W.timeline.h}); save(); tl=find(); }
      var node=tl && document.querySelector('.grid-stack-item[gs-id="'+tl.id+'"]');
      if(node && node.scrollIntoView) node.scrollIntoView({behavior:'smooth', block:'center'});
    });
    on('copy', function(b){ copyText(SIT.report(s.scope, 'full'), b); });
    on('afcopy', function(b){ var a=SIT.after(endSc); if(a) copyText(a.text, b); });
    on('afclose', function(){ SIT.dismiss(endSc); SIT.renderBar(); });
    on('simend', function(){ try{ sessionStorage.setItem('ggDashSimEnd', '1'); }catch(e){} location.reload(); });
    on('endsim', function(){ window.DASHW.sim(false); });
  };

  /* 상황보고 문구 — 지금 자료에 있는 것만. 기준 통과와 사실만 적고 권고는 쓰지 않는다 */
  SIT.report = function(scope, form){
    var d=D(), st=stationNow(), sg=sigunOf(st), now=Date.now(), mine=scope!=='all', L=[];
    var fT=function(ts){ return dayStart(ts)===dayStart(now) ? fHM(ts) : fMDHM(ts); };
    L.push((SIT.sim?'[모의 훈련] ':'')+'['+(RC.label||'')+(mine ? ' '+st : '')+' 기상 상황보고] '+fMDHM(now)+' 현재');
    if(mine){
      var s=statusOf(st), wd={safe:'정상', warn:'주의', severe:'경보'}[s.lv];
      L.push('■ 상태: '+wd+(s.why.length ? ' — '+s.why.join(' · ') : ''));
    } else {
      var bad=ORDER.filter(function(n){ return statusOf(n).lv!=='safe'; });
      L.push(bad.length ? '■ 상태: 주의 이상 '+bad.length+'개 관서 ('+bad.slice(0,5).map(function(n){ return n+' '+(statusOf(n).lv==='severe'?'경보':'주의'); }).join(', ')+(bad.length>5?' 외':'')+')' : '■ 상태: 전 관서 정상');
    }
    var ws=(d.warnings||[]).filter(function(w){ return !mine || areaHits(w.area, st); });
    L.push(ws.length ? '■ 특보: '+ws.map(function(w){ var wt=SIT.warnTime(w, mine ? st : null); return w.type+'('+fT(wt.ts)+SIT.srcWord(wt.src)+') '+(w.area||''); }).join(' / ') : '■ 특보: 발효 없음');
    if(mine){
      var reg=regOf(st), r1=rain1h(reg), rd=rainDay(reg);
      if(r1!=null) L.push('■ 강수: '+st+' 1시간 '+num(r1,1)+'mm'+(rd!=null ? ' · 오늘 누적 '+num(rd,1)+'mm' : ''));
    } else {
      /* 같은 시의 두 관서(분당·성남, 일산·고양, 송탄·평택)는 관측값이 같다 — 본체 시 이름으로 한 번만 */
      var rows=ORDER.filter(function(n){ return sigunOf(n)===n; }).map(function(n){ return {n:n, v:rain1h(regOf(n))}; }).filter(function(x){ return x.v!=null; }).sort(function(a,b){ return b.v-a.v; });
      if(rows.length){
        if(rows[0].v<0.1) L.push('■ 강수: 전 관서 1시간 0mm');
        else { var more=rows.slice(1).filter(function(x){ return x.v>=5; }).slice(0,4);
          L.push('■ 강수: 최대 '+rows[0].n+' 1시간 '+num(rows[0].v,1)+'mm'+(more.length ? ' · 그 밖에 '+more.map(function(x){ return x.n+' '+num(x.v,1); }).join(', ') : '')); }
      }
    }
    var rv=(mine ? riversOf(st) : (d.rivers||[]).filter(function(r){ return !isDam(r); })).filter(function(r){ if(!r.danger) return false; var l=riverLv(r); return l==='warn'||l==='severe'; });
    rv.sort(function(a,b){ return riverPctRaw(b)-riverPctRaw(a); });
    L.push(rv.length ? '■ 하천: '+rv.slice(0,5).map(function(r){ var p=riverParts(r), nm=p.river+(p.site ? ' '+p.site.split(/\s+/).pop() : '');
      return nm+(riverLv(r)==='severe' ? ' 위험수위 넘음' : ' 주의수위 넘음')+'('+Math.round(riverPctRaw(r)*100)+'%)'; }).join(' / ') : '■ 하천: 주의수위 넘은 곳 없음');
    if(mine){
      try{
        var rk=RISKZ.peek(st);
        if(rk && rk.state==='ok'){
          var f1=checkZones(st, rk.items, checkLive(st)).filter(function(z){ return z.tier==='first'; });
          if(f1.length) L.push('■ 점검: 먼저 볼 곳 '+f1.length+'곳 중 '+f1.filter(function(z){ return z.ts; }).length+'곳 확인');
        }
      }catch(e){}
      if(s.lv==='warn' || s.lv==='severe'){
        try{
          var tp=TODO.progress(s.lv);
          if(tp && tp.n>0) L.push('■ 조치: '+(s.lv==='severe' ? '경보' : '주의')+' 단계 '+tp.n+'개 중 '+tp.m+'개 완료');
        }catch(e){}
      }
    }
    var uf=((d.ultra_fcst||{})[sg]||[]).slice(0,6);
    if(uf.length){
      var mx=null; uf.forEach(function(u){ var v=+u.rain_mm||0; if(v>0 && (mx==null || v>mx.v)) mx={v:v, h:String(u.time||'').slice(0,2)}; });
      L.push('■ 예보: '+(mine ? '' : sg+' ')+(mx ? '앞으로 6시간 최대 '+num(mx.v,1)+'mm('+mx.h+'시)' : '앞으로 6시간 비 예보 없음'));
    }
    var today0=dayStart(now);
    if(SIT.notes && !SIT.sim){
      var dn=SIT.dispatchEvents().filter(function(e){ return e.ts>=today0 && (!mine || mineHit(e)); }), by={}, order=[];
      dn.forEach(function(e){ if(!by[e.dtype]){ by[e.dtype]=0; order.push(e.dtype); } by[e.dtype]++; });
      L.push('■ 출동: 오늘 '+dn.length+'건'+(order.length ? ' ('+order.map(function(t){ return t+' '+by[t]; }).join(', ')+')' : ''));
    }
    var ms=SIT.events(scope, 48).filter(function(e){ return e.kind==='msg' && e.ts>=today0; });
    if(ms.length) L.push('■ 재난문자: 오늘 '+ms.length+'건 (마지막 '+fHM(ms[0].ts)+')');
    if(form==='full'){
      /* 점검·조치 체크는 위의 ■ 점검 / ■ 조치 줄에 개수로 들어가 있다 — 경과에서는 빼서 특보·수위 같은 일이 밀려나지 않게 */
      var ev=SIT.events(scope, 24).filter(function(e){ return e.kind!=='msg' && !(e.kind==='note' && /^(점검|조치) · /.test(e.text||'')); }).slice(0,8).reverse();
      if(ev.length){ L.push('■ 주요 경과'); ev.forEach(function(e){ L.push(' - '+fHM(e.ts)+' '+e.text); }); }
    }
    var u=String(d.updated||'').match(/\d{4}-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    L.push('※ 자료: 기상청 · 한강홍수통제소'+(u ? ', '+u[1]+'/'+u[2]+' '+u[3]+':'+u[4]+' 갱신' : ''));
    return L.join('\n');
  };

  /* 사후 보고 초안 — 진행 중이면 지금까지, 끝났으면 가장 최근 끝난 상황(7일 안). 기록해 둔 사실만 적고 평가·권고는 쓰지 않는다 */
  SIT.after = function(scope){
    scope=scope==='all' ? 'all' : 'mine';
    var rec=null, ongoing=false;
    if(SIT.levelOf(scope).active){ rec=SIT.run(scope); ongoing=!!rec; }
    if(!rec) rec=SIT.last(scope);
    if(!rec) return null;
    var now=Date.now(), end=ongoing ? now : rec.end, mine=scope==='mine', stn=rec.station||stationNow();
    var fR=function(ts){ return dayStart(ts)===dayStart(rec.since) ? fHM(ts) : fMDHM(ts); };
    var fm=function(v){ return (+v).toFixed(2).replace(/0$/, ''); };
    var warns=(rec.warns||[]).slice().sort(function(a,b){ return a.ts-b.ts; });
    var wide=warns.some(function(w){ return String(w.type||'').indexOf('호우')>=0; }) ? '호우' : '기상';
    var secs=[], lines;
    /* 1. 개요 */
    lines=[];
    lines.push(' - 기간: '+fMDHM(rec.since)+' ~ '+(ongoing ? '진행 중 ('+fDur(now-rec.since)+'째)' : fMDHM(end)+' ('+fDur(end-rec.since)+')'));
    lines.push(' - 최고 단계: '+(rec.lvMax==='severe' ? '경보' : '주의'));
    lines.push(' - 특보: '+(warns.length ? warns.map(function(w){ return w.type+'('+fR(w.ts)+SIT.srcWord(w.src)+')'; }).join(' → ') : '없음'));
    secs.push({t:'개요', l:lines});
    /* 2. 기상·수위 */
    lines=[];
    if(rec.r1) lines.push(' - 최대 1시간 강수: '+num(rec.r1.v,1)+'mm ('+rec.r1.st+', '+fR(rec.r1.ts)+' 관측)');
    if(rec.day) lines.push(' - 일 누적 강수 최대: '+num(rec.day.v,1)+'mm ('+rec.day.st+(rec.day.d ? ', '+rec.day.d : '')+')');
    if(rec.river){
      var rp=riverParts({name:rec.river.name});
      lines.push(' - 하천 최고: '+rp.river+(rp.site ? ' '+rp.site.split(/\s+/).pop() : '')+' '+fm(rec.river.value)+'m (위험수위 '+fm(rec.river.danger)+'m의 '+Math.round(rec.river.pct)+'%, '+fR(rec.river.ts)+')');
    }
    secs.push({t:'기상·수위', l:lines});
    /* 이 기간의 기록 */
    var evs=SIT.eventsBetween(scope, rec.since-1800000, end, stn).slice().reverse();   /* 오래된 것부터 */
    var noteLines=function(list, strip){
      var out=list.slice(0,12).map(function(e){ return '   · '+fR(e.ts)+' '+(strip ? String(e.text||'').replace(strip, '') : e.text); });
      if(list.length>12) out.push('   · 그 밖에 '+(list.length-12)+'건');
      return out;
    };
    var notes=evs.filter(function(e){ return e.kind==='note'; });
    var doneN=notes.filter(function(e){ return /^조치 · /.test(e.text||''); });
    var chkN=notes.filter(function(e){ return /^점검 · /.test(e.text||''); });
    var otherN=notes.filter(function(e){ return !/^(점검|조치) · /.test(e.text||''); });
    /* 3. 조치 */
    lines=[];
    if(rec.todo && rec.todo.n>0) lines.push(' - 대응 체크리스트: '+(TODO_LAB[rec.todo.stage]||'')+' 단계 '+rec.todo.n+'개 중 '+rec.todo.m+'개 완료');
    if(rec.chk && rec.chk.n>0) lines.push(' - 위험구역 점검: 먼저 볼 곳 '+rec.chk.n+'곳 중 '+rec.chk.m+'곳 확인');
    if(doneN.length){ lines.push(' - 조치 기록'); noteLines(doneN, /^조치 · /).forEach(function(x){ lines.push(x); }); }
    if(chkN.length){ lines.push(' - 점검 기록'); noteLines(chkN, /^점검 · /).forEach(function(x){ lines.push(x); }); }
    if(otherN.length){ lines.push(' - 그 밖의 기록'); noteLines(otherN, null).forEach(function(x){ lines.push(x); }); }
    secs.push({t:'조치', l:lines});
    /* 4. 출동 — 출동 메모를 읽어 온 경우만 */
    lines=[];
    var dsp=(SIT.notes && !SIT.sim) ? evs.filter(function(e){ return e.kind==='dispatch'; }) : [];
    if(dsp.length){
      var by={}, order=[];
      dsp.forEach(function(e){ if(!by[e.dtype]){ by[e.dtype]=0; order.push(e.dtype); } by[e.dtype]++; });
      lines.push(' - 모두 '+dsp.length+'건 ('+order.map(function(t){ return t+' '+by[t]; }).join(', ')+')');
      dsp.slice(0,12).forEach(function(e){ lines.push(' - '+fR(e.ts)+' '+e.dtype+(e.place ? ' · '+e.place : '')); });
      if(dsp.length>12) lines.push(' - 그 밖에 '+(dsp.length-12)+'건');
    }
    secs.push({t:'출동', l:lines});
    /* 5. 시간대별 경과 — 기록해 둔 특보 시각은 지금 자료에 없으면 여기서 보탠다 */
    /* 수동 기록·점검·조치는 위 '조치' 절에 이미 있다 — 경과에는 특보·강수·수위처럼 자동으로 잡힌 일만 (같은 줄이 두 번 나오지 않게) */
    var tl=evs.filter(function(e){ return e.kind!=='msg' && e.kind!=='dispatch' && e.kind!=='note'; });
    warns.forEach(function(w){
      if(w.ts<rec.since-1800000 || w.ts>end) return;
      var tol=w.src==='서버' ? 3600000 : 60000;   /* 서버가 처음 본 시각은 서버 발효 줄과 몇 분 어긋날 수 있다 */
      if(!tl.some(function(e){ return e.kind==='warn' && e.tw===w.type && Math.abs(e.ts-w.ts)<=tol; })) tl.push({ts:w.ts, kind:'warn', text:w.type+(w.src==='발표' ? ' 발표' : (w.src==='서버' ? ' 발효' : ' 발효 중'))});
    });
    tl.sort(function(a,b){ return a.ts-b.ts; });
    lines=tl.slice(0,30).map(function(e){ return ' - '+fR(e.ts)+' '+e.text; });
    if(tl.length>30) lines.push(' - 그 밖에 '+(tl.length-30)+'건');
    secs.push({t:'시간대별 경과', l:lines});

    var L=[(SIT.sim ? '[모의 훈련] ' : '')+'['+(RC.label||'')+(mine ? ' '+stn : '')+' '+wide+' 상황 사후 보고 (초안)]'], n=0;
    secs.forEach(function(s){ if(!s.l.length) return; n++; L.push(n+'. '+s.t); s.l.forEach(function(x){ L.push(x); }); });
    L.push('※ 화면에 남은 기록으로 만든 초안입니다 · 강수 최대값은 화면이 열려 있던 동안의 관측값입니다');
    L.push('※ 자료: 기상청 · 한강홍수통제소');
    return {text:L.join('\n'), rec:rec, ongoing:ongoing};
  };

  /* 모의 훈련 — 받아 온 자료를 제자리에서 바꾼다. 실제 기록과는 저장 키가 다르다 */
  SIT.applySim = function(data){
    if(!SIT.sim || !data || simOver()) return;
    var me=stationNow(), n=ORDER.length, i=ORDER.indexOf(me), nb=[], now=Date.now();
    /* 이웃 둘 — 같은 시(분당→성남, 일산→고양)는 건너뛴다. 특보 지역에 같은 이름이 두 번 나오지 않게 */
    for(var k=1, seenSg=[sigunOf(me)]; k<n && nb.length<2; k++){ var cand=ORDER[(i+k)%n]; if(seenSg.indexOf(sigunOf(cand))<0){ seenSg.push(sigunOf(cand)); nb.push(cand); } }
    data.warnings=[

  /* ── 위험구역 시트 읽기 ── 구글시트(관서마다 탭 하나)를 읽기만 한다. 지금 보는 관서만, 탭은 차례로(429 방지), 30분 보관 ── */
  var RISKZ = { cache:{} };
  function csvRows(text){
    var rows=[], row=[], cur='', q=false, n=text.length, i, c;
    text = String(text||'').replace(/^﻿/, '');
    n = text.length;
    for(i=0; i<n; i++){
      c = text.charAt(i);
      if(q){
        if(c==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n' || c==='\r'){ if(c==='\r' && text.charAt(i+1)==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
      else cur+=c;
    }
    if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function csvIsHead(row){ return row.some(function(c){ c=String(c); return c.indexOf('주소')>=0 || c.indexOf('유형')>=0; }); }
  function csvCol(row, key){ for(var i=0; i<row.length; i++){ if(String(row[i]).indexOf(key)>=0) return i; } return -1; }
  function csvCoord(v, lim){ var x=parseFloat(String(v==null?'':v).trim()); return (isNaN(x) || Math.abs(x)>lim) ? null : x; }
  /* filt=true: 기본 탭 — 지역 칸이 이 관서인 줄만. false: 이 관서 탭 — 모든 줄 */
  RISKZ.parse = function(text, st, filt){
    var rows=csvRows(text), hi=-1, out=[], admin=(RC.admin&&RC.admin[st])||'', r;
    for(r=0; r<rows.length && r<5; r++){ if(csvIsHead(rows[r])){ hi=r; break; } }
    if(hi<0) return out;
    var h=rows[hi], iA=csvCol(h,'지역'), iD=csvCol(h,'주소'), iT=csvCol(h,'유형'), iLa=csvCol(h,'위도'), iLn=csvCol(h,'경도');
    if(iD<0 && iT<0) return out;
    var cell=function(row, i){ return i>=0 && i<row.length ? String(row[i]).replace(/^\s+|\s+$/g,'') : ''; };
    for(r=hi+1; r<rows.length; r++){
      var row=rows[r], area=cell(row,iA), type=cell(row,iT), name=cell(row,iD);
      if(!type && !name) continue;
      if(filt && !(area && (area===st || area===admin || area.indexOf(st)===0))) continue;
      out.push({id:st+'|'+name+'|'+type, type:type, name:name, lat:csvCoord(cell(row,iLa),90), lng:csvCoord(cell(row,iLn),180)});
    }
    return out;
  };
  RISKZ.url = function(tab){
    var b=window.RISK_SHEET_URL; if(!b) return null;

  };
  RISKZ.fetchText = function(url){
    return fetch(url, {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.text(); }).then(function(t){
      if(/^\s*</.test(t) || t.indexOf('setResponse')>=0) throw new Error('bad response');
      return t;
    });
  };
  RISKZ.load = function(st){
    var c={t:Date.now(), state:'loading', items:[]}; RISKZ.cache[st]=c;
    if(!window.RISK_SHEET_URL){ c.state='none'; return; }
    var admin=(RC.admin&&RC.admin[st])||'', tabs=[st], items=[], seen={}, soft=false, defText=null;
    if(admin && admin!==st) tabs.push(admin);
    var add=function(list){ list.forEach(function(z){ if(!seen[z.id]){ seen[z.id]=1; items.push(z); } }); };
    var finish=function(state){
      /* 요청이 하나라도 실패했으면(네트워크·429·오류 화면) 찾은 줄은 보여 주되 보관하지 않고 5분 뒤 다시 읽는다 */
      var res={t:Date.now(), state:state, items:state==='ok' ? items : [], partial:soft && state!=='fail'};
      RISKZ.cache[st]=res;
      if(state!=='fail' && !res.partial){ try{ sessionStorage.setItem('ggRiskZ.v1.'+st, JSON.stringify(res)); }catch(e){} }
      try{ renderAll(); }catch(e){ if(window.console) console.error(e); }
    };
    var step=function(i){
      if(i>=tabs.length){ finish(items.length ? 'ok' : (soft ? 'fail' : 'none')); return; }
      RISKZ.fetchText(RISKZ.url(tabs[i])).then(function(t){
        if(t!==defText) add(RISKZ.parse(t, st, false));   /* 없는 탭을 부르면 첫 탭이 그대로 온다 → 기본 탭과 같으면 없는 탭 */
        step(i+1);
      }, function(){ soft=true; step(i+1); });
    };
    try{
      RISKZ.fetchText(RISKZ.url(null)).then(function(t){ defText=t; add(RISKZ.parse(t, st, true)); step(0); }, function(){ finish('fail'); });
    }catch(e){ finish('fail'); }
  };
  /* 보관된 결과(없으면 null). 읽기 실패는 5분 뒤, 나머지는 30분 뒤 다시 읽는다 */
  RISKZ.real = function(st){
    var c=RISKZ.cache[st], now=Date.now();

      if(s && s.t && now-s.t < 1800000 && (s.state==='ok' || s.state==='none') && Array.isArray(s.items)){ RISKZ.cache[st]={t:s.t, state:s.state, items:s.items}; return RISKZ.cache[st]; }

  /* ── 지금 점검할 곳 ── 위험구역 시트의 곳을 지금 강수·특보·하천 값과 겹쳐 먼저/다음/평소로 나눈다. 화면은 사실과 기준만 적는다 ── */
  /* 기준은 여기 한 곳. first = 먼저 볼 곳, next = 다음 볼 곳. 값이 기준 이상이면 해당 */
  var CHECK_RULES = {
    flood: { first:{r1:20, r3:60}, next:{r1:5, f6:20} },     /* 침수형: 시간당·3시간 강수, 6시간 예보 최대 */

    ['slope', /산사태|급경사|사면|옹벽|축대|태양광|절개/],
    ['water', /야영|캠핑|계곡|유원지|물놀이/],
    ['flood', /침수|지하차도|반지하|저지대|하천|세월교|둔치|배수|도로/]
  ];
  var CHECK_GORDER = {flood:0, water:1, slope:2, etc:3};
  var CHECK_TORDER = {first:0, next:1, rest:2};
  function checkGroup(type){
    for(var i=0; i<CHECK_GROUPS.length; i++){ if(CHECK_GROUPS[i][1].test(type||'')) return CHECK_GROUPS[i][0]; }
    return 'etc';
  }
  function checkNum(v){ return (v==null || v==='' || isNaN(+v)) ? null : +v; }
  /* 이 관서의 지금 값. 없는 값은 null (그 검사는 건너뜀) */
  function checkLive(st){
    var reg=regOf(st), cum=((reg||{}).detail||{}).rain_cumul||{}, c12=checkNum(cum['12h']);
    if(c12==null) c12=checkNum(((((reg||{}).detail||{}).aws)||{}).rn12h);   /* 12시간 값만 — 오늘 0시부터의 누적은 12시간이 아니다 */
    var L={ r1:rain1h(reg), r3:checkNum(cum['3h']), r12:c12, day:checkNum(rainDay(reg)), f6:null, wBo:false, wJu:false, sv:[], wn:[] };
    var uf=((D().ultra_fcst||{})[sigunOf(st)]||[]).slice(0,6);

    (D().warnings||[]).filter(function(w){ return areaHits(w.area, st) && String(w.type||'').indexOf('호우')>=0; }).forEach(function(w){ if(isBo(w)) L.wBo=true; else L.wJu=true; });
    riversOf(st).forEach(function(r){ var l=riverLv(r); if(l==='severe') L.sv.push(riverName(r)); else if(l==='warn') L.wn.push(riverName(r)); });

  function checkHits(rule, L){

    return out;
  }
  function checkTierOf(grp, L){
    var R=CHECK_RULES[grp==='slope' ? 'slope' : 'flood'], river=grp!=='slope', f=checkHits(R.first, L), n;
    if(river) L.sv.slice(0,2).forEach(function(nm){ f.push(nm+' 위험수위 넘음'); });
    if(f.length) return {tier:'first', reasons:f};
    n=checkHits(R.next, L);
    if(river) L.wn.slice(0,2).forEach(function(nm){ n.push(nm+' 주의수위 넘음'); });
    return n.length ? {tier:'next', reasons:n} : {tier:'rest', reasons:[]};
  }
  /* 확인 표시 — 이 브라우저에만, 24시간 */
  function chkKey(){ return 'ggDashChk.v1.'+(RC.key||'x')+(SIT.sim ? '.sim' : ''); }
  /* 확인·체크 표시가 '이번 상황'의 것인가 — 내 관서 상황이 진행 중이면 그 시작(30분 전)부터, 아니면 24시간 안.
     저장된 표시를 지우는 건 예전처럼 24시간이 지났을 때뿐 */
  function markFloor(){
    var cut=Date.now()-86400000, r=null;
    try{ if(SIT.levelOf('mine').active) r=SIT.run('mine'); }catch(e){}
    return (r && r.since) ? Math.max(cut, r.since-1800000) : cut;
  }
  function markLive(ts, fl){ return ts>=(fl==null ? markFloor() : fl); }
  function chkRead(raw){
    var m=jget(chkKey(), {}), out={}, cut=Date.now()-86400000, fl=raw ? cut : markFloor();
    if(m && typeof m==='object') Object.keys(m).forEach(function(k){ if(+m[k]>=cut && markLive(+m[k], fl)) out[k]=+m[k]; });
    return out;
  }
  function chkWrite(m){ storeSet(chkKey(), JSON.stringify(m)); }
  /* 보이는 이름만 다듬는다(id 는 원래 이름 기준 그대로): 앞의 시도명·관서 공식 이름을 빼고, 맨 앞에서 되풀이되는 낱말은 하나로 */
  function checkName(st, name){
    var raw=String(name||'').replace(/^\s+|\s+$/g, ''), s=raw, ad=(RC.admin && RC.admin[st]) || '', lab=RC.label || '', t, i;
    var cut=function(p){ if(p && s.indexOf(p+' ')===0){ s=s.slice(p.length+1).replace(/^\s+/, ''); return true; } return false; };
    if(lab && !cut(lab) && !/도$/.test(lab)) cut(lab+'도');

  }

  /* ── 대응 체크리스트 ── 단계(평시·주의·경보)별 할 일. 항목은 화면에서 고치고, 목록·체크는 이 브라우저에만 저장한다 ── */
  var TODO_LAB = {safe:'평시', warn:'주의', severe:'경보'};

  /* 저장된 목록. 저장한 적이 없으면 기본 예시(저장은 처음 고칠 때) */
